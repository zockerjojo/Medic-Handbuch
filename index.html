<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medic-Handbuch</title>
<style>

*{box-sizing:border-box}
body{margin:0;display:flex;height:100vh;background:var(--bg);color:var(--t);font:16px/1.55 system-ui,"Segoe UI",sans-serif}
nav{width:250px;flex:none;display:flex;flex-direction:column;background:var(--p);border-right:1px solid var(--l);padding:20px 12px;overflow:auto}
nav h1{font:700 22px Georgia,serif;margin:0 8px 18px}
.cr{display:flex;align-items:center;gap:6px;padding:8px 10px;margin:2px 0;border-radius:4px;cursor:pointer}
.cr:hover{background:var(--l)}.cr.on{background:var(--a);color:#241a05;font-weight:600}
.cr span{flex:1}.cr i{font-style:normal;color:var(--m)}.cr.on i{color:#241a05}
.tg{width:14px;font-weight:400;text-align:center}
.gl{margin:0 0 6px 22px;border-left:1px solid var(--l)}
.gl a{display:block;padding:4px 10px;color:var(--m);border-radius:4px;text-decoration:none}.gl a:hover{background:var(--l);color:var(--t)}
.foot{margin-top:auto;padding-top:16px;display:flex;gap:6px;flex-wrap:wrap}
main{flex:1;overflow:auto;padding:22px clamp(16px,4vw,48px)}
#sb{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 14px;display:flex;gap:10px;max-width:760px}
#q{flex:1;min-width:0;padding:13px 16px;border:1px solid var(--l);border-radius:24px;background:var(--p);color:var(--t);font:inherit}
button{font:inherit;color:var(--t);background:none;border:1px solid var(--l);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--a)}
.btn{background:var(--a);color:#241a05;border-color:var(--a);font-weight:600;border-radius:20px;white-space:nowrap}
.danger{color:var(--r);border-color:var(--r)}
.st{border:0;color:var(--a);font-size:20px;padding:0 4px}
.card{max-width:760px;margin:0 0 30px;padding-left:18px;border-left:3px solid var(--l);scroll-margin-top:76px}
.card.gone{opacity:.65}.card.fl{animation:fl 1.4s}@keyframes fl{from{box-shadow:0 0 0 4px rgba(242,184,75,.6)}to{box-shadow:0 8px 24px rgba(0,0,0,.28)}}

.c{color:var(--m);font-size:13px;margin:0 0 6px}
p{margin:4px 0}ul,ol{margin:0;padding-left:22px}li{margin:2px 0}

.ct{display:inline-flex;gap:2px;opacity:0;transition:opacity .15s;flex:none}
.row:hover>.ct,.row:focus-within>.ct{opacity:1}
@media(hover:none){.ct{opacity:1}}
.ct button{border:0;padding:0 5px;color:var(--m);font-size:14px;line-height:1.5}
.ct button:hover{color:var(--a);background:none}
.me{margin-top:16px;padding:6px;background:var(--me);border:1px solid var(--l);border-radius:6px}
.ml{padding:4px 6px;border-radius:4px;cursor:pointer;color:#cfe0ee}.ml:hover{background:var(--l)}
.ml small{display:block;padding:2px 4px}
.ad{margin:6px 0 2px;padding:4px 12px;border-radius:14px;border-color:var(--a);color:var(--a)}

.form h3{margin:0;font:700 20px Georgia,serif}

.form textarea{min-height:70px}
.err{margin:0;color:var(--r);font-size:14px}
.empty{color:var(--m)}
.tw{overflow-x:auto;margin:8px 0}table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border:1px solid var(--l);text-align:left;vertical-align:top}th{background:var(--l);color:var(--a)}
select{padding:7px;border-radius:4px;background:var(--p);color:var(--t);border:1px solid var(--l);font:inherit}
.bo{color:#cfe0ee}
.okt{color:#9fd3a4}
#ok{position:fixed;bottom:20px;right:20px;padding:8px 16px;border-radius:4px;background:var(--a);color:#241a05;opacity:0;transition:opacity .2s;pointer-events:none}#ok.on{opacity:1}
.lk{color:var(--a)}
:focus-visible{outline:2px solid var(--a)}
@media(max-width:700px){body{flex-direction:column;height:auto}nav{width:100%}}
#f{position:absolute;top:calc(100% - 10px);left:0;right:0;z-index:6}
#f .form{max-width:none;margin:0;max-height:calc(100vh - 170px);overflow:auto;box-shadow:0 14px 32px #000a}
.hv{opacity:0;transition:opacity .15s}
h2:hover .hv,h2:focus-within .hv{opacity:1}
@media(hover:none){.hv{opacity:1}}
.card h2{cursor:pointer}
.arw{cursor:pointer;color:var(--m);font:400 18px/1.4 system-ui,"Segoe UI",sans-serif;width:20px;flex:none;text-align:center;user-select:none}
.arw:hover{color:var(--a)}
.card.folded>*:not(h2){display:none}
.sep{height:1px;background:var(--l);margin:10px 8px}
.card{border:1px solid #34475c;border-radius:14px;padding:16px 16px 18px;margin:0 0 28px;background:linear-gradient(180deg,#1b2736,#151e2b);box-shadow:0 8px 24px rgba(0,0,0,.28);transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:rgba(242,184,75,.4);box-shadow:0 10px 30px rgba(0,0,0,.36)}
@media(min-width:700px){.card{padding:20px 26px 22px}}
.warn{color:var(--r);font-size:13px;margin:14px 4px 0;line-height:1.4}
.secform{margin:12px 0 0;padding:14px}
.sec{margin:4px 0 0}
.sec h4{display:flex;align-items:baseline;gap:6px;cursor:pointer;margin:14px 0 4px}
.sarw{color:var(--m);width:16px;flex:none;text-align:center;font-size:14px;user-select:none}
.sarw:hover,.sec h4:hover .sarw{color:var(--a)}
.sec:not(.open)>.sbody{display:none}
.smode{background:var(--bg);color:var(--t);border:1px solid var(--l);border-radius:4px;font:inherit;font-size:12px;padding:1px 4px;max-width:160px}
.ml.nt{cursor:default;color:var(--m);font-style:italic}
.ml.nt:hover{background:none}
</style></head><body>

{"id":"Verbrennung 2. Grades","cat":"b","title":"Verbrennung 2. Grades","desc":"","kw":"","sections":[{"h":"Erkennung","items":["Tieferer Hautschaden: sichtbare Blasen (offen oder geschlossen), Rötung, Schmerz, Schwellung","2a: geschlossene Blasen, heilt spontan. 2b: offene Blasen, tiefer Schaden, lokal behandelbar"]},{"h":"Behandlung","items":["2a: lokale Betäubung, antiseptisch spülen, Brandsalbe, Mullbinde","2b: zusätzlich totes Gewebe entfernen, Hauttransplantat, Silbersulfadiazin-Creme"]},{"h":"Ablauf","items":["Wunde lokal betäuben","Wunde antiseptisch spülen (2b: gründlich desinfizieren)","2b: abgestorbenes Gewebe entfernen, Haut transplantieren und einnähen","Brandsalbe auftragen (2b: zusätzlich Silbersulfadiazin)","Mit Mullbinden verbinden, Schmerzmittel geben"]}],"table":null,"widget":false,"me":["/me betäubt die Wunde lokal","/me spült die Wunde antiseptisch aus","/me trägt Brandsalbe auf","/me verbindet die Wunde mit Mullbinden","/me gibt Schmerzmittel","/me desinfiziert die Brandwunde gründlich","/me entfernt abgestorbenes Gewebe","/me transplantiert Haut und näht sie ein","/me trägt Brandsalbe und Silbersulfadiazin auf"]},
{"id":"SCP-527 und Kopfverletzungen","cat":"b","title":"SCP-527 und Kopfverletzungen","desc":"","kw":"","sections":[{"h":"Erkennung","items":["Sichtbare Wunden oder Blutungen am Kopf, Schmerzen oder Schwellung","Untersuchung: Vitalwerte, Röntgen, Bluttest"]},{"h":"Behandlung","items":["Desinfizieren, mit Lidocain betäuben, Schuppen entfernen, nähen und verbinden"]},{"h":"Ablauf","items":["Wundbereich gründlich desinfizieren","Lokal mit Lidocain betäuben","Schuppen um die Wunde vorsichtig mit Pinzette entfernen","Abgestorbenes Gewebe ausschneiden, Wunde präzise nähen","Sterile Wundkompresse auflegen, mit elastischer Mullbinde fixieren","Vitalwerte kontrollieren, Fäden nach 10–14 Tagen ziehen, bevor neue Schuppen wachsen"]}],"table":null,"widget":false,"me":["/me desinfiziert die Wunde am Kopf","/me betäubt den Bereich lokal mit Lidocain","/me entfernt vorsichtig Schuppen mit Pinzette","/me schneidet abgestorbenes Gewebe aus","/me näht die Wunde präzise","/me legt sterile Wundkompresse auf","/me fixiert die Kompresse mit Mullbinde"]},
{"id":"SCP-4287","cat":"b","title":"SCP-4287","desc":"","kw":"","sections":[{"h":"Erkennung","items":["Blutende Wunden oder fehlende Federn, Schwellung oder Rötung der Haut","Wichtig: Infektionsgefahr, besonders durch Pasteurellen"]},{"h":"Behandlung","items":["Wunde reinigen und desinfizieren, bei Bedarf Lidocain, Antibiotikum Baytril (Enrofloxacin) gegen Pasteurellen"]},{"h":"Ablauf","items":["Wunde vorsichtig reinigen und desinfizieren","Bei Bedarf lokal betäuben (z. B. Lidocain)","Lose Federn nur vorsichtig entfernen","Bei Bedarf Bandage anlegen","Baytril verabreichen, Heilungsfortschritt beobachten"]}],"table":null,"widget":false,"me":["/me reinigt und desinfiziert die Wunde vorsichtig","/me betäubt die Wunde lokal","/me entfernt vorsichtig lose Federn","/me legt bei Bedarf eine Bandage an","/me verabreicht Baytril"]},
{"id":"Hunde","cat":"b","title":"Hunde","desc":"","kw":"","sections":[{"h":"Erkennung","items":["Normwerte: Puls 70–100/min, Blutdruck ca. 110/60 bis 140/80 mmHg, Temperatur 38–39 °C, Atmung 16–18/min","Blutgruppen DEA 1.1, 1.2, 3.0, 4.0, 5.0, 7.0 mit Rhesusfaktor, DEA 1.1 negativ ist Universalspender"]},{"h":"Behandlung","items":["Carprofen (Entzündungshemmer, Gelenke), Metamizol (starkes Schmerzmittel), Tepoxalin (Muskeln und Skelett)","Warnung: Colistin niemals bei Hunden, es ist toxisch","Knochenbruch: operative Fixierung oder Gips, oft kombiniert"]},{"h":"Ablauf","items":["Puls, Atmung, Temperatur und Blutdruck prüfen","Fell um die Wunde rasieren","Wunde reinigen, desinfizieren, ggf. nähen","Verband oder Bandage anlegen","Bruch operativ oder mit Gips fixieren","Bei Narkose: Wärmelampe gegen Unterkühlung, Beißschutz, Zunge sichern"]}],"table":null,"widget":false,"me":["/me überprüft Puls, Atmung, Temperatur und Blutdruck","/me rasiert das Fell um die Wunde","/me reinigt und desinfiziert die Wunde","/me legt Verband oder Bandage an","/me fixiert Knochenbruch operativ oder mit Gips"]},
{"id":"SCPs: Übersicht der Behandlung","cat":"b","title":"SCPs: Übersicht der Behandlung","desc":"","kw":"","sections":[{"h":"Zuordnung","items":["SCP-131: Augentropfen ins Auge träufeln oder Nanobots","SCP-999: reproduziertes Gelee verabreichen","SCP-066: mit reproduziertem Garn behandeln","SCP-527: wie ein Mensch, außer bei Kopfverletzung (eigener Eintrag)","SCP-1048: Füllwatte ausstopfen und wieder zunähen","SCP-4287: gängige Methoden, immer mit Baytril gegen Pasteurellen"]}],"table":null,"widget":false,"me":[]},
{"id":"Narkose einleiten","cat":"n","title":"Narkose einleiten","desc":"","kw":"fentanyl propofol intubation ekg schlaf","sections":[{"h":"Ablauf","items":["Reiner Sauerstoff als Reserve, venöser Zugang (ggf. zweiter für Bluttransfusion)","Fentanyl (Schmerzmittel), dann Propofol (Schlafmittel)","EKG: Herz und Kreislauf überwachen","Patient schläft nach Sekunden ein, dann intubieren und Atmung sichern"]},{"h":"Überwachung","items":["Puls, Blutdruck, Sauerstoffsättigung, Atmung"]},{"h":"Ende","items":["Narkosemittel absetzen, extubieren, überwachen bis stabil"]}],"table":null,"widget":false,"me":["/me legt vorsichtig einen venösen Zugang","/me verabreicht Fentanyl und Propofol","/me überwacht die Vitalwerte auf dem EKG"]},
{"id":"Lokalanästhesie","cat":"n","title":"Lokalanästhesie","desc":"","kw":"betäubung lidocain prilocain bupivacain","sections":[{"h":"Wann","items":["Nur eine Stelle (Handrücken, Wunde, Muttermal): Injektion, Creme, Gel oder Spray"]},{"h":"Medikamente","items":["Lidocain, Prilocain, Bupivacain"]},{"h":"Nebenwirkungen","items":["Übelkeit, Schwindel, niedriger Blutdruck; Dosis nach Körpergewicht"]}],"table":null,"widget":false,"me":["/me sprüht die Betäubungscreme auf die Wunde","/me wartet ein paar Minuten, bis die Stelle taub ist"]},
{"id":"Regional-, Plexus- und Spinalanästhesie","cat":"n","title":"Regional-, Plexus- und Spinalanästhesie","desc":"","kw":"betäubung nervenblockade rückenmark ivra tourniquet","sections":[{"h":"Regional und Plexus (Arm oder Bein, Patient wach)","items":["Haut desinfizieren, Nadel oder Katheter einführen (oft mit Ultraschall), Mittel z. B. Lidocain spritzen"]},{"h":"Spinal (Unterkörper, 1–2 Std.)","items":["Punktionsstelle am Rücken desinfizieren, lokal betäuben, Spinalnadel setzen, Mittel in den Spinalraum"]},{"h":"IVRA (ca. 1 Std.)","items":["Tourniquet anlegen, Extremität blutleer machen, Mittel in die Vene"]}],"table":null,"widget":false,"me":["/me führt vorsichtig die Nadel ein und überprüft die Betäubung","/me bereitet die Punktionsstelle am Rücken vor","/me spritzt das Betäubungsmittel langsam in den Spinalraum","/me wartet, bis der Unterkörper betäubt ist"]},
{"id":"Herzinfarkt","cat":"o","title":"Herzinfarkt","desc":"","kw":"herz stent katheter lisinopril ballon","sections":[{"h":"Erkennung","items":["Herzmuskel bekommt zu wenig Sauerstoff, weil ein Herzkranzgefäß verengt oder verschlossen ist"]},{"h":"Behandlung","items":["Lisinopril zur Gefäßerweiterung, Katheter mit Ballon und Stent öffnet das verengte Herzgefäß"]},{"h":"Ablauf","items":["Lisinopril-2,5 zur Gefäßerweiterung","Narkose, Katheter über die Armarterie zum verengten Herzgefäß","Kontrastmittel und Röntgen: Position prüfen","Ballon aufblasen, Stent setzen, Arterie offen halten","Katheter entfernen, Wunde versorgen, Überwachung"]},{"h":"Geräte","items":["Katheter, Röntgengerät, Kontrastmittel, Ballon und Stent"]}],"table":null,"widget":false,"me":["/me gibt dem Patienten die Tablette Lisinopril-2,5","/me legt den Patienten für die Narkose bereit","/me führt den Katheter vorsichtig über die Armarterie ein","/me spritzt Kontrastmittel und überprüft die Position am Röntgengerät","/me platziert den Stent und bläst den Miniaturballon auf","/me entfernt den Katheter und versorgt die Wunde","/me überwacht die Vitalwerte, während der Patient aus der Narkose erwacht"]},
{"id":"Gesplitterter Bruch","cat":"o","title":"Gesplitterter Bruch","desc":"","kw":"knochen osteosynthese platte schrauben heparin","sections":[{"h":"Erkennung","items":["Knochenstücke lassen sich nicht mehr zusammenfügen oder sind verschoben, Röntgen zeigt die genaue Lage"]},{"h":"Behandlung","items":["Operative Fixierung mit Platte und Zugschrauben, dazu Heparin gegen Thrombose"]},{"h":"Ablauf","items":["Röntgen, Heparin gegen Thrombose","Betäuben, Stelle desinfizieren, Knochen mit Skalpell freilegen","Splitter mit Pinzette entfernen, Metallplatte und Zugschrauben setzen, Haut schließen"]},{"h":"Nachsorge","items":["Vitalwerte und Infektionen überwachen, Heparin weitergeben, regelmäßig röntgen"]}],"table":null,"widget":false,"me":["/me erstellt ein Röntgenbild zur Beurteilung des Bruchs","/me desinfiziert die Operationsstelle gründlich","/me fixiert die Bruchfragmente mit Platte und Zugschrauben","/me überwacht die Vitalwerte und verabreicht Heparin"]},
{"id":"Schädel-Hirn-Trauma","cat":"o","title":"Schädel-Hirn-Trauma","desc":"Verletzung von Schädelknochen oder Gehirn durch Unfall, Sturz oder Gewalt. Gefahr durch Blutungen und erhöhten Hirndruck.","kw":"","sections":[{"h":"Erkennung","items":["CT oder MRT (Blutungen, Brüche, Schwellungen)","Neurotests: Bewusstsein, Sprache, Pupillenreaktion","SpO₂, Blutdruck, Puls und Hirndruck überwachen"]},{"h":"Behandlung","items":["Operation: Schädeldecke öffnen, Fragmente entfernen, Druck senken, Schädelplatte einsetzen"]},{"h":"Ablauf","items":["Narkose einleiten, Bereich rasieren","Kopfhaut desinfizieren, Schädeldecke eröffnen","Bruchstücke entfernen, Schädelplatte zur Stabilisierung anpassen","Dura öffnen, Flüssigkeit absaugen, Druck senken","Dura verschließen, Operationsgebiet spülen","Kopfhaut klammern, sterilen Verband anlegen","Danach Vitalwerte, Hirndruck und Sprache kontrollieren"]},{"h":"Richtwerte","items":["Hirndruck (ICP): normal unter 15 mmHg, kritisch über 20","SpO₂ über 95 %, Blutdruck systolisch über 100 mmHg","GCS (Bewusstsein): 3–15"]}],"table":null,"widget":false,"me":["/me überprüft Bewusstsein und Pupillenreaktion des Patienten","/me legt venösen Zugang und bereitet die Narkoseeinleitung vor","/me desinfiziert den betroffenen Kopfbereich und eröffnet die Schädeldecke","/me entfernt vorsichtig Frakturfragmente und passt die Schädelplatte an","/me saugt überschüssige Flüssigkeit ab und verschließt die Dura","/me klammert die Kopfhaut und legt einen sterilen Verband an"]},
{"id":"Brustverletzung (Thoraxtrauma)","cat":"o","title":"Brustverletzung (Thoraxtrauma)","desc":"Verletzung von Brustkorb, Organen und angrenzenden Strukturen. Stumpf: keine offene Wunde (Rippen, Sternum, Wirbelsäule, Lunge). Penetrierend: offene Wunde, z. B. Stich oder Schuss, oft mit Gefahr für Lunge und Herz.","kw":"","sections":[{"h":"Behandlung","items":["Thoraxdrainage saugt Blut und Luft aus dem Brustraum"]},{"h":"Ablauf","items":["Narkose einleiten, Patient vorbereiten","Einstich- oder Schnittstelle desinfizieren","Steriles Lochtuch auflegen","Schnitt durch Rippenfell und Lungenfell","Thoraxdrainage einbringen, Blut und Luft absaugen","Vitalwerte während des Eingriffs überwachen","Einschnitt vernähen, Narkose beenden"]},{"h":"Geräte","items":["Röntgen oder CT (Brüche, Pneumothorax)","Thoraxdrainage zur Absaugung von Blut und Luft","Vitalwertmonitor (EKG, Blutdruck, Puls, SpO₂)"]}],"table":null,"widget":false,"me":["/me leitet die Narkose ein und bereitet den Patienten für den Eingriff vor","/me desinfiziert die Einstichstelle und legt das Lochtuch auf","/me führt den Schnitt durch Rippen- und Lungenfell aus","/me bringt die Thoraxdrainage ein und überwacht die Vitalwerte","/me vernäht den Einschnitt und beendet die Narkose"]},
{"id":"Kollabierte Lunge (Pneumothorax)","cat":"o","title":"Kollabierte Lunge (Pneumothorax)","desc":"Luft gelangt in den Pleuraspalt, die Lunge fällt teilweise oder ganz zusammen. Ursachen: Stich- oder Schussverletzung, Rippenbruch, Lungenerkrankung oder spontan. Symptome: Atemnot, Brustschmerzen, vermindertes Atemgeräusch.","kw":"","sections":[{"h":"Behandlung","items":["Thoraxdrainage entfernt die Luft, die Lunge entfaltet sich wieder"]},{"h":"Ablauf","items":["Einstichstelle am Brustkorb desinfizieren","Kleinen Schnitt zwischen den Rippen setzen","Drainage einführen, an Absaug- oder Wasserballonsystem anschließen","Vitalwerte und Lungenentfaltung per Röntgen oder Ultraschall überwachen","Drainage fixieren, Haut verschließen","Lungenfunktion kontrollieren, Drainage nach vollständiger Entfaltung entfernen"]},{"h":"Geräte","items":["Röntgen oder CT, Thoraxdrainage oder Saugdrainage, steriles OP-Besteck, Vitalwertmonitor"]}],"table":null,"widget":false,"me":["/me desinfiziert die Einstichstelle am Brustkorb","/me führt den Schnitt zwischen den Rippen durch","/me platziert die Thoraxdrainage und verbindet sie mit dem Absaugsystem","/me überwacht die Vitalwerte und kontrolliert die Lungenexpansion","/me fixiert die Drainage und verschließt die Haut"]},
{"id":"Durchschuss und innere Blutungen","cat":"o","title":"Durchschuss und innere Blutungen","desc":"Penetrierende Verletzung mit schwerer innerer Blutung, wenn eine Arterie getroffen ist. Symptome: Blutdruckabfall, schneller Puls, blasse Haut, Schwindel, Bewusstlosigkeit.","kw":"","sections":[{"h":"Behandlung","items":["Blutung mit Arterienklemmen stoppen, Arterie mit Kunststoffgefäß oder Patch rekonstruieren"]},{"h":"Ablauf","items":["Operationsbereich vorbereiten und steril abdecken","Wunde mit Hautklammern oder Schnitt öffnen","Arterienklemmen setzen, Blutung stoppen","Blut absaugen, Wunde mit Ringerlösung spülen","Kunststoffgefäß oder Patch einnähen, Arterie rekonstruieren","Gefäßnaht fixieren, Wunde schließen","Schmerzmittel geben, Vitalwerte überwachen"]},{"h":"Geräte","items":["Steriles OP-Besteck, Arterienklemmen, Absauggerät, Ringerlösung, Kunststoffgefäß oder Patch, Vitalwertmonitor"]}],"table":null,"widget":false,"me":["/me öffnet die Wunde vorsichtig, um Zugang zur verletzten Arterie zu bekommen","/me setzt Arterienklemmen und stoppt die Blutung","/me saugt Blut ab und spült die Wunde mit Ringerlösung","/me näht ein Kunststoffgefäß ein, um die Arterie zu rekonstruieren","/me schließt die Wunde und überwacht die Vitalwerte"]},
{"id":"Korrosion durch SCP-106 (Pocket Dimension)","cat":"o","title":"Korrosion durch SCP-106 (Pocket Dimension)","desc":"Der Korrosionseffekt von SCP-106 zerstört Gewebe rasant, ähnlich einer nekrotisierenden Hautinfektion. Symptome: starke Schmerzen, hohes Fieber, schneller Puls, Hautverfärbung (blass bis schwarz), Schwellung. Unbehandelt droht Sepsis.","kw":"","sections":[{"h":"Behandlung","items":["Totes Gewebe entfernen, Haut transplantieren, Defekte mit Kunststoffimplantaten füllen, Antibiotika"]},{"h":"Ablauf","items":["Patient vorbereiten, steril abdecken","Kochsalzlösung i.v. zur Kreislaufstabilisierung","Betroffene Bereiche einschneiden, Ausmaß der Nekrose bestimmen","Abgestorbenes Gewebe entfernen, gesundes erhalten","Entscheiden, ob amputiert werden muss","An wichtigen Stellen (Gesicht, Hände, Gelenke) Vollhaut transplantieren","Kunststoffimplantate in verbleibende Defekte einsetzen","Heilsalbe auftragen, sterile Verbände anlegen","Antibiotika (nur im RP), Vitalwerte und Wundheilung kontrollieren"]},{"h":"Geräte","items":["OP-Besteck, Infusion mit Kochsalzlösung, Vollhaut zur Transplantation, Kunststoffimplantate, Vitalwertmonitor"]}],"table":null,"widget":false,"me":["/me prüft die betroffene Stelle auf Ausmaß der Korrosion","/me macht präzise Einschnitte, um totes Gewebe zu identifizieren","/me entfernt abgestorbenes Gewebe und transplantiert gesunde Haut","/me setzt Kunststoffimplantate an beschädigten Stellen ein","/me trägt Salbe auf, legt sterile Verbände an und überwacht die Vitalwerte"]},
{"id":"Amputation","cat":"o","title":"Amputation","desc":"Chirurgische Entfernung eines Körperteils bei schweren Verletzungen, Infektionen oder Durchblutungsstörungen. Ziel: Lebensgefahr abwenden und gute Wundheilung ermöglichen.","kw":"","sections":[{"h":"Behandlung","items":["Körperteil unter Narkose und Tourniquet chirurgisch entfernen, Stumpf versorgen"]},{"h":"Ablauf","items":["Narkose einleiten, ggf. Plexusblockade gegen Schmerzen","Tourniquet oberhalb des Bereichs anlegen (verhindert Blutverlust)","Haut zylindrisch ausschneiden, Zugang zu Gelenk oder Knochen schaffen","Gelenk trennen, Knochen abtrennen, kürzen und abstumpfen","Knochen mit Splint fixieren","Blutgefäße mit Kauterpinzette veröden","Haut über dem Knochen sorgfältig vernähen","Aufwachen aus der Narkose, Vitalwerte überwachen"]},{"h":"Geräte","items":["Narkoseausrüstung, Tourniquet, Skalpell, Kauterpinzette, Splint, Nahtmaterial, sterile Verbände"]}],"table":null,"widget":false,"me":["/me leitet die Narkose ein und legt das Tourniquet an","/me schneidet die Haut zylindrisch aus und trennt Knochen und Gewebe","/me fixiert den Knochen mit einem Splint und verödet Gefäße","/me vernäht die Haut und legt sterile Verbände an","/me überwacht den Patienten beim Erwachen aus der Narkose"]},
{"id":"Schlaganfall","cat":"o","title":"Schlaganfall","desc":"Ein Blutgefäß im Gehirn ist verstopft, das Hirngewebe bekommt zu wenig Sauerstoff. Folgen: Lähmungen, Sprach- und Sinnesstörungen, Koordinationsprobleme, Bewusstlosigkeit.","kw":"","sections":[{"h":"Behandlung","items":["Blutdruck senken, Alteplase löst das Gerinnsel, Stent-Retriever entfernt es mechanisch"]},{"h":"Ablauf","items":["Vitalwerte prüfen, ggf. Sauerstoff über Maske","Blutdruck senken, z. B. 10 mg Esmolol i.v.","Gerinnsel auflösen: 15 mg Alteplase als Infusion über 90 Min.","Katheter über die Leistenarterie einführen","Stent-Retriever einsetzen, Gerinnsel entfernen","Mit Kontrastmittel und Röntgen navigieren","Vitalwerte während und nach dem Eingriff überwachen"]},{"h":"Geräte","items":["CT-Scan (CCT) zur Lage des Gerinnsels, Bluttests, Katheter mit Stent-Retriever, Kontrastmittel und Röntgen"]}],"table":null,"widget":false,"me":["/me überprüft die Vitalwerte des Patienten","/me legt eine Sauerstoffmaske an","/me spritzt Esmolol zur Blutdruckkontrolle","/me verabreicht Alteplase-Infusion über 90 Minuten","/me führt Katheter über die Leistenarterie ein","/me navigiert den Stent-Retriever mithilfe von Kontrastmittel und Röntgenbildern","/me entfernt das Blutgerinnsel und überprüft die Durchblutung"]},
{"id":"Lebertrauma","cat":"o","title":"Lebertrauma","desc":"Verletzung der Leber durch stumpfe Gewalt (Unfall, Sturz, Schlag) oder penetrierende Gewalt (Messer, Schuss). Die Leber ist stark durchblutet, schon kleine Risse können lebensgefährlich bluten.","kw":"","sections":[{"h":"Erkennung","items":["Ultraschall oder CT, besonders bei Bauchverletzungen, großen Blutergüssen oder Verdacht auf innere Blutung"]},{"h":"Behandlung","items":["Blutung stillen mit Druck und Fibrinkleber, bei schwerer Blutung Gefäße verschließen"]},{"h":"Ablauf","items":["Hautschnitt, Bauch öffnen, vorhandenes Blut absaugen","Leichte Blutung: mit sterilen Tüchern Druck ausüben, dann Fibrinkleber auftragen","Schwere Blutung: verletzte Arterien oder Venen chirurgisch verschließen","Vitalwerte und Leberwerte kontrollieren"]},{"h":"Leberwerte","items":["GOT (AST): normal unter ca. 45 U/l, erhöht bei Leberverletzung","GPT (ALT): normal unter ca. 45 U/l, Marker für Leberzellschäden","Bilirubin gesamt: 0,3–1,2 mg/dl, erhöht bei gestörter Leberfunktion oder Gallenabfluss"]}],"table":null,"widget":false,"me":["/me untersucht den Bauchraum per Ultraschall auf freie Flüssigkeit","/me legt einen venösen Zugang und bereitet Blutabnahme für Leberwerte vor","/me öffnet vorsichtig den Bauchraum und saugt Blut ab","/me trägt Fibrinkleber auf die verletzte Stelle auf","/me kontrolliert abschließend die Vitalwerte und dokumentiert die Leberwerte"]},
{"id":"Hüftersatz","cat":"o","title":"Hüftersatz","desc":"Chirurgischer Eingriff, bei dem ein beschädigtes oder schmerzhaftes Hüftgelenk durch eine künstliche Prothese ersetzt wird. Ziel: Schmerzen lindern, Beweglichkeit wiederherstellen, Lebensqualität verbessern.","kw":"","sections":[{"h":"Behandlung","items":["Künstliche Hüftprothese einsetzen: beschädigtes Gelenk entfernen, Knochen zuschneiden, Prothese mit Schrauben fixieren"]},{"h":"Ablauf","items":["Narkose einleiten, Schmerzmanagement abstimmen","Operationsstelle reinigen","Haut und Weichgewebe zurückklappen, Hüfte freilegen","Osteotomie: beschädigtes Gelenk entfernen, Knochen für die Prothese zuschneiden","Prothesenkopf in den Oberschenkelknochen einsetzen","Prothesenkörper im Beckenkamm mit Schrauben oder Befestigungsmitteln fixieren","Haut und Weichgewebe vernähen","Danach Vitalwerte und Schmerzmanagement überwachen"]},{"h":"Geräte","items":["Röntgen oder CT zur Planung, chirurgisches Instrumentarium für Osteotomie und Prothesenfixierung, Tupfer und Nahtmaterial"]}],"table":null,"widget":false,"me":["/me bereitet die Operationsstelle vor und desinfiziert sie","/me legt Haut und Weichgewebe zurück","/me entfernt das beschädigte Gelenk und schneidet die Knochen zu","/me setzt die Prothese ein und fixiert sie","/me vernäht die Haut und kontrolliert die Blutung"]},
{"id":"Trommelfellriss","cat":"o","title":"Trommelfellriss","desc":"Ein geplatztes Trommelfell entsteht durch starken Druck oder laute Geräusche (z. B. Explosionen) und führt zu Schmerzen, Hörverlust oder Blutungen im Ohr.","kw":"","sections":[{"h":"Behandlung","items":["Trommelfell glätten und mit Silikonfolie schienen, Ohrentropfen gegen Schmerz und Entzündung"]},{"h":"Ablauf","items":["Narkose einleiten, um Schmerzen zu vermeiden","Ohr reinigen, Schmutz und Blut entfernen","Eingerollte Ränder des gerissenen Trommelfells glätten","Silikonfolie als Schiene zur Stabilisierung einsetzen","Ohr erneut spülen, um Rückstände zu entfernen","Schmerzlindernde Ohrentropfen verabreichen","Bei Bedarf Hörgerät einsetzen","Narkose beenden und den Patienten engmaschig überwachen"]},{"h":"Geräte","items":["Otoskop, Narkoseausrüstung, Silikonfolie zur Schienung, Ohrenspüllösung und sterile Tupfer"]}],"table":null,"widget":false,"me":["/me überprüft das Trommelfell mithilfe des Otoskops","/me reinigt das Ohr vorsichtig","/me glättet die eingerollten Ränder des Trommelfells","/me legt die Silikonfolie als Schiene ein","/me spült das Ohr erneut aus","/me tropft schmerzlindernde Ohrentropfen ein","/me überwacht den Patienten nach Beendigung der Narkose"]},
{"id":"Gehirntumor (Wach-OP)","cat":"o","title":"Gehirntumor (Wach-OP)","desc":"Abnorme Zellwucherung im Gehirn, die Druck auf benachbarte Strukturen ausübt und neurologische Funktionen beeinträchtigt. Die Behandlung hängt von Lage, Größe und Art des Tumors ab.","kw":"","sections":[{"h":"Erkennung","items":["MRT oder CT: Tumorgröße, Lage und angrenzendes Gewebe","Fluoreszenzmittel macht den Tumor während der OP sichtbar","Neurologische Tests: Sprache, Bewegung, Sensorik"]},{"h":"Behandlung","items":["Tumor beim wachen Patienten mit Ultraschall oder Laser präzise entfernen, Sprache und Bewegung laufend prüfen"]},{"h":"Ablauf","items":["Wach-OPs werden immer von mindestens zwei Chirurgen durchgeführt","Vorbereitung: lokale Betäubung am Kopf, Kopf in stabiler Halterung fixieren","Zweiter Arzt prüft während der OP regelmäßig Sprache und Funktionen","Zugang: Hautschnitt, Schädelknochen mit Bohrungen und Sägen öffnen","Hirnhaut öffnen, mit Spreizern präzisen Zugang zum Tumor schaffen","Tumor abtrennen, mit Ultraschall- oder Lasersystem präzise entfernen","Blut absaugen, ggf. Kunstgewebe einsetzen","Abschluss: sterilisieren, Dura verschließen, Kopfhaut nähen, sterilen Verband anlegen"]},{"h":"Überwachung","items":["Puls, Blutdruck und Sauerstoffsättigung kontinuierlich, dazu regelmäßige Sprach- und Bewegungschecks"]}],"table":null,"widget":false,"me":["/me überprüft Bewusstsein und Vitalwerte des Patienten vor OP-Beginn","/me fixiert den Kopf in der stabilen Halterung und injiziert lokale Betäubung","/me führt Schnitt durch die Haut und öffnet den Schädelknochen","/me öffnet vorsichtig die Hirnhaut und platziert Spreizer für besseren Zugang","/me entfernt Tumor präzise mit Ultraschall-Laser und saugt Blut ab","/me sterilisiert das Operationsgebiet","/me verschließt die Dura, näht die Kopfhaut und legt sterilen Verband an","/me überprüft fortlaufend neurologische Funktionen während der Wach-OP"]},
{"id":"Blutvergiftung (Sepsis)","cat":"o","title":"Blutvergiftung (Sepsis)","desc":"Lebensbedrohliche Reaktion des Körpers auf eine Infektion: Bakterien oder Giftstoffe im Blut lösen eine schwere Entzündung aus. Ursachen: infizierte Wunden, Lungenentzündung, Harnwegs- oder Bauchinfektionen. Symptome: Fieber, Schüttelfrost, beschleunigter Puls, niedriger Blutdruck, Verwirrtheit.","kw":"","sections":[{"h":"Behandlung","items":["Kreislauf stabilisieren, Breitbandantibiotika, Dialyse, Infektionsquelle operativ entfernen"]},{"h":"Ablauf","items":["Venösen Zugang für Infusionen und Medikamente legen","Kochsalzlösung zur Stabilisierung des Kreislaufs geben","Breitbandantibiotika gegen die Infektion verabreichen","Dialyse einleiten (entfernt giftige Substanzen und überschüssige Flüssigkeit)","Infektionsquelle operativ entfernen, falls möglich","Bei starkem Blutverlust Bluttransfusion durchführen"]},{"h":"Geräte","items":["Venöser Zugang (z. B. Shaldon-Katheter), Infusionssysteme für Kochsalzlösung und Heparin, Blutkulturen und Labor, Dialysegerät, EKG, Blutdruck- und Sauerstoffmonitor, OP-Besteck"]}],"table":null,"widget":false,"me":["/me legt einen venösen Zugang für Infusionen und Medikamente","/me verabreicht Kochsalzlösung und Antibiotika","/me platziert einen Shaldon-Katheter und startet die Dialyse","/me entfernt operativ die Infektionsquelle, falls erforderlich","/me überwacht die Vitalwerte und passt die Therapie an"]},

{"id":"Verätzungen","cat":"o","title":"Verätzungen","desc":"Direkter Kontakt der Haut mit ätzenden Chemikalien wie Säuren oder Laugen (Laborunfälle, industrielle Chemikalien, gefährliche SCPs). Symptome: starke Schmerzen, Rötung, Blasenbildung, Gewebeschäden, bei großen Flächen auch Reaktionen im ganzen Körper.","kw":"","sections":[{"h":"Behandlung","items":["Sofort lange spülen, Kleidung entfernen, je nach Grad Salbe, Wundversorgung oder chirurgische Entfernung, Antibiotika"]},{"h":"Ablauf","items":["Betroffene Haut sofort mindestens 15–20 Minuten mit viel Wasser oder NaCl spülen","Kontaminierte Kleidung und Rückstände vorsichtig entfernen","1. Grad: Reinigung, Kühlung, schmerzlindernde Salbe","2. Grad: abgestorbenes Gewebe entfernen, steril abdecken, Schmerzmittel und Antibiotika","3. und 4. Grad: Nekrosen chirurgisch entfernen, ggf. Hauttransplantation, engmaschig überwachen","Verbände fixieren, Heilungsverlauf regelmäßig kontrollieren","Antibiotika gegen Infektionen bei offenen Wunden"]},{"h":"Geräte","items":["Steriles Spülset (NaCl oder Wasser), Wundverbände und Brandwundenauflagen, Pinzette und Skalpell, Schmerzmittel und Antibiotika, Vitalwertmonitor, bei schweren Fällen Transplantationsbesteck"]}],"table":null,"widget":false,"me":["/me spült die betroffene Hautpartie gründlich mit sterilem Wasser","/me entfernt kontaminierte Kleidung und Rückstände vorsichtig","/me trägt Salbe oder Gel auf und deckt die Wunde steril ab","/me entfernt abgestorbenes Gewebe bei tieferen Verätzungen","/me legt neue sterile Verbände an und überwacht die Vitalwerte"]},

/* ===== Grundlagen ===== */
const $ = s => document.querySelector(s);

/* ===== Speicher: eine Datei, eine Form ===== */
const fresh = () => ({ov: {}, del: {}, fav: [], order: [], made: []});
function save(){ try { store.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Speichern nicht möglich'); } }

  const ids = SEED.map(r => r.id).concat(made.map(r => r.id)), seen = new Set(), out = [];
  (saved || []).concat(ids).forEach(id => { if (ids.includes(id) && !seen.has(id)) { seen.add(id); out.push(id); } });

}
function load(){

  else { // bisherige Version: Kennung = Titel, daher keine Umwandlung nötig
    try { S.fav = JSON.parse(store.getItem('f')) || []; } catch (e) {}

/* ===== Akten lesen und ändern (immer kopierend, nie die Grunddaten verändern) ===== */
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  const o = S.ov[id] || {};
  return Object.assign({}, BASE[id], o, {sections: withKeys(o.sections || BASE[id].sections)});
};
const all = () => S.order.map(get).filter(Boolean);

}

    if (!text || text === '/me' || text === 'Notiz:') me.splice(+p[1], 1); else me[+p[1]] = text;

function move(id, s, i, d){
  const r = get(id), j = i + d;

  if (s === 'm') { const me = r.me.slice(); if (swap(me)) patch(id, 'me', me); }

}
function removeLine(id, s, i){

}

function delSection(id, s){ const secs = clone(get(id).sections); secs.splice(s, 1); patch(id, 'sections', secs); }
function moveRec(id, d){
  const r = get(id), o = S.order, i = o.indexOf(id);

  while (j >= 0 && j < o.length && get(o[j]).cat !== r.cat) j += d;
  if (j >= 0 && j < o.length) { [o[i], o[j]] = [o[j], o[i]]; save(); }
}
const trash = id => { S.del[id] = 1; save(); };
const restore = id => { delete S.del[id]; save(); };
const reset = id => { delete S.ov[id]; save(); };
const fav = id => { S.fav = S.fav.includes(id) ? S.fav.filter(x => x !== id) : S.fav.concat(id); save(); };

}
function create(f){
  const e = {}, cat = f.cat, title = String(f.title || '').replace(/\s+/g, ' ').trim();
  if (!C[cat] || RO[cat]) e.cat = 'Diese Kategorie ist schreibgeschützt.';
  if (!title) e.title = 'Bitte einen Titel eingeben.';
  else if (all().some(r => nf(r.title) === nf(title))) e.title = 'Diesen Titel gibt es schon.';

/* ===== Verweise, Text und Suche ===== */
const resolve = t => { const s = String(t).trim(), q = nf(s), r = all().find(x => x.id === s || nf(x.title) === q); return r ? r.id : null; };
function fmt(s){   // gespeicherter Klartext -> sicheres HTML

    if (/^\[\[.+\]\]$/.test(p)) { const t = p.slice(2, -2), id = resolve(t); return id ? `<a href="#" class="lk" data-act="go" data-id="${esc(id)}">${esc(t)}</a>` : esc(t); }
    if (/^\*\*.+\*\*$/.test(p)) return '<b>' + esc(p.slice(2, -2)) + '</b>';

}
const haystack = r => nf([r.title, r.desc, r.kw, ...r.sections.map(s => s.h + ' ' + s.items.join(' ')), r.table ? r.table.r.map(x => x.join(' ')).join(' ') : '', r.me.join(' ')].join(' '));

/* ===== Anzeige ===== */
let formRendered = null;
const MODES = {bullet: 'Stichpunkte', number: 'Zahlenfolge (1., 2., 3.)', text: 'Einfacher Text'};
const modeOf = s => (s.mode && own(MODES, s.mode)) ? s.mode : (s.h === 'Ablauf' ? 'number' : 'bullet');
const secOpen = (id, k) => openSec.has(id + '|' + k);
function card(r){

  const ed = b('edit', '✎', 'Bearbeiten');
  const ord = (s, i) => b('move', '▲', 'Nach oben', `data-s="${s}" data-i="${i}" data-d="-1"`) + b('move', '▼', 'Nach unten', `data-s="${s}" data-i="${i}" data-d="1"`) + b('remove', '✕', 'Entfernen', `data-s="${s}" data-i="${i}"`);
  const arrow = `<span class="arw" data-act="fold" data-id="${id}" title="Ein- und ausklappen" aria-label="Ein- und ausklappen">${shut ? '▸' : '▾'}</span>`;

    if (on) h += `<div class="gl">${rs.map(r => `<a href="#" data-act="go" data-id="${esc(r.id)}">${esc(r.title)}</a>`).join('')}</div>`;

function secFormHTML(sf, id){

function readForm(){

  else if (view === 'trash') { list = trashed(); empty = 'Der Papierkorb ist leer.'; }
  else if (view === 'fav') { list = live().filter(r => S.fav.includes(r.id)); empty = 'Noch keine Favoriten. Mit ☆ merkst du dir eine Akte.'; }

    const c = [...document.querySelectorAll('.card')].find(x => x.dataset.rec === p.id);
    if (c) { c.scrollIntoView({block: 'center'}); c.classList.add('fl'); }

/* ===== Bearbeiten: ein Mechanismus für alle Textstellen ===== */
function startEdit(el){
  if (editing) finishEdit();
  editing = {el, cancel: false};
  el.contentEditable = 'true'; el.classList.add('ed');
  el.textContent = el.dataset.raw; el.focus();
  const rg = document.createRange(); rg.selectNodeContents(el);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg);
}
function finishEdit(){
  if (!editing) return;
  const {el, cancel} = editing; editing = null;
  el.contentEditable = 'false'; el.classList.remove('ed');
  if (!cancel) { const t = el.textContent.replace(/\s+/g, ' ').trim(); if (t !== el.dataset.raw) setText(el.dataset.rec, el.dataset.path, t); }
  render();
}

/* ===== Aktionen: ein Handler für alle Schaltflächen (data-act) ===== */
function openRec(id){
  const r = get(id);
  if (!r) return;
  const next = S.del[id] ? 'trash' : r.cat;
  if (next !== view) { folded.clear(); openSec.clear(); }
  folded.delete(id); clearSecs(id);
  view = next; query = ''; $('#q').value = ''; opened.add(r.cat); sectionForm = null;
  pending = {id}; render();
}
function setQuery(v){ query = v; folded.clear(); render(); }
function toggleFold(id){ if (folded.has(id)) { folded.delete(id); clearSecs(id); } else folded.add(id); }
function toggleSec(id, k){ const key = id + '|' + k; if (openSec.has(key)) openSec.delete(key); else openSec.add(key); }
function openSecAt(id, si){ const r = get(id), s = r && r.sections[si]; if (s) openSec.add(id + '|' + s.k); }
function clearSecs(id){ [...openSec].forEach(k => { if (k.startsWith(id + '|')) openSec.delete(k); }); }
function focusField(sel){ const t = document.querySelector(sel); if (t) t.focus(); }
function newKey(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function moveSection(id, si, d){
  const secs = clone(get(id).sections), j = si + d;
  if (j < 0 || j >= secs.length) return;
  [secs[si], secs[j]] = [secs[j], secs[si]];
  patch(id, 'sections', secs);
}
function setSecMode(id, si, mode){
  if (!own(MODES, mode)) return;

  if (!secs[si]) return;
  secs[si].mode = mode;
  patch(id, 'sections', secs);
}
function submit(){
  const v = readForm(), secs = FORM[v.cat] || DEFAULT_FORM;
  const r = create({cat: v.cat, title: v.title, desc: v.desc, sections: secs.map((h, i) => ({h, text: v.text[i] || ''}))});
  if (r.errors) { formState = Object.assign(v, {errors: r.errors}); return render(); }
  formState = null; view = v.cat; query = ''; opened.add(v.cat); $('#q').value = ''; folded.clear(); openSec.clear(); sectionForm = null;
  pending = {id: r.id}; render(); toast('Akte angelegt');
}
function act(name, b){
  const d = b.dataset, id = d.id;
  if (name === 'edit') return startEdit(b.closest('[data-hold]').querySelector('.tx'));
  if (name === 'go') return openRec(id);
  if (name === 'toggle') { if (opened.has(d.v)) opened.delete(d.v); else opened.add(d.v); return renderNav(); }
  if (name === 'create') return submit();
  if (name === 'export') return exportData();
  if (name === 'import') return $('#imp').click();
  if (name === 'fold') { toggleFold(id); return render(); }
  if (name === 'secopen') { toggleSec(id, d.sk); return render(); }
  if (name === 'view') { view = d.v; query = ''; $('#q').value = ''; folded.clear(); openSec.clear(); sectionForm = null; if (C[d.v]) opened.add(d.v); }
  else if (name === 'fav') fav(id);
  else if (name === 'move') move(id, d.s, +d.i, +d.d);
  else if (name === 'secmove') moveSection(id, +d.s, +d.d);
  else if (name === 'remove') removeLine(id, d.s, +d.i);
  else if (name === 'add') { if (d.s !== 'm') openSecAt(id, +d.s); pending = {id, path: addLine(id, d.s, d.start)}; }
  else if (name === 'delsec') delSection(id, +d.s);
  else if (name === 'recmove') moveRec(id, +d.d);
  else if (name === 'trash') trash(id);
  else if (name === 'restore') restore(id);
  else if (name === 'purge') { if (confirm('Akte endgültig löschen? Das lässt sich nicht rückgängig machen.')) purge(id); }
  else if (name === 'reset') { if (confirm('Eigene Änderungen an dieser Akte verwerfen?')) reset(id); }
  else if (name === 'newform') formState = formState ? null : {cat: (C[view] && !RO[view]) ? view : 'b', title: '', desc: '', text: []};
  else if (name === 'closeform') formState = null;
  else if (name === 'secform') sectionForm = (sectionForm && sectionForm.id === id) ? null : {id, name: '', text: '', mode: 'bullet', errors: null};
  else if (name === 'secsave') {
    if (sectionForm) {
      const res = addSection(id, sectionForm.name, sectionForm.text, sectionForm.mode);
      if (res.errors) sectionForm.errors = res.errors;
      else { openSec.add(id + '|' + res.k); sectionForm = null; toast('Abschnitt hinzugefügt'); }
    }
  }
  else if (name === 'seccancel') sectionForm = null;
  render();
  if (name === 'newform' && formState) focusField('#ftitle');
  if (name === 'secform' && sectionForm) focusField('[data-sf="name"]');
}

/* ===== Abschnitt hinzufügen: frei gewählter Name, Darstellung, mindestens eine Zeile ===== */
function addSection(id, name, text, mode){
  const r = get(id), n = cleanText(name), items = lines(text), e = {};
  if (!r || RO[r.cat]) return {errors: {name: 'Bei dieser Akte lassen sich keine Abschnitte hinzufügen.'}};
  if (!n) e.name = 'Bitte einen Namen eingeben.';
  else if (n.length > 60) e.name = 'Der Name darf höchstens 60 Zeichen lang sein.';
  else if (r.sections.some(s => nf(s.h) === nf(n))) e.name = 'Einen Abschnitt mit diesem Namen gibt es schon.';
  if (!items.length) e.text = 'Mindestens eine Zeile eingeben.';
  if (Object.keys(e).length) return {errors: e};
  const secs = clone(r.sections), k = newKey();
  secs.push({h: n, items, mode: own(MODES, mode) ? mode : 'bullet', k});
  patch(id, 'sections', secs);
  return {ok: true, k};
}

/* ===== Import: jede Angabe wird geprüft, ungültige Teile werden übersprungen ===== */
const cleanText = t => (typeof t === 'string' ? t.replace(/\s+/g, ' ').trim() : '');
function looksLikeExport(d){
  return !!d && typeof d === 'object' && !Array.isArray(d) && ['ov', 'del', 'fav', 'made', 'order'].some(k => k in d);
}
function cleanSections(x){
  const out = [];
  (Array.isArray(x) ? x : []).forEach(s => {
    if (!s || typeof s !== 'object') return;
    const h = cleanText(s.h), items = (Array.isArray(s.items) ? s.items : []).filter(t => typeof t === 'string' && t.trim()).map(t => t.trim());
    if (!h || !items.length) return;
    const o = {h, items};
    if (typeof s.k === 'string' && s.k) o.k = s.k;
    if (own(MODES, s.mode)) o.mode = s.mode;
    out.push(o);
  });
  return out;
}
function cleanMade(x, seen){
  if (!x || typeof x !== 'object' || !Array.isArray(x.sections)) return null;
  const id = typeof x.id === 'string' ? x.id.trim() : '', title = cleanText(x.title);
  if (!id || own(BASE, id) || seen.has(id) || !own(C, x.cat) || RO[x.cat] || !title) return null;
  return {id, cat: x.cat, title, desc: typeof x.desc === 'string' ? x.desc : '', kw: '', sections: cleanSections(x.sections),
    me: Array.isArray(x.me) ? x.me.filter(t => typeof t === 'string') : [], table: null, widget: false};
}
function cleanOv(x){
  const o = {};
  if (!x || typeof x !== 'object') return o;
  const t = cleanText(x.title); if (t) o.title = t;
  if (typeof x.desc === 'string') o.desc = x.desc;
  if (Array.isArray(x.me)) o.me = x.me.filter(v => typeof v === 'string');
  if (Array.isArray(x.sections)) o.sections = cleanSections(x.sections);
  return o;
}
function sanitize(d){
  const out = fresh(), seen = new Set();
  let skipped = 0;
  if (Array.isArray(d.made)) d.made.forEach(x => {
    const m = cleanMade(x, seen);
    if (m) { seen.add(m.id); out.made.push(m); } else skipped++;
  });
  const known = id => own(BASE, id) || seen.has(id);
  if (d.ov && typeof d.ov === 'object') Object.keys(d.ov).forEach(k => {
    if (!own(BASE, k)) { skipped++; return; }
    const o = cleanOv(d.ov[k]);
    if (Object.keys(o).length) out.ov[k] = o;
  });
  if (d.del && typeof d.del === 'object') Object.keys(d.del).forEach(k => { if (known(k)) out.del[k] = 1; else skipped++; });
  if (Array.isArray(d.fav)) out.fav = [...new Set(d.fav.filter(x => typeof x === 'string' && known(x)))];
  out.order = orderFix(Array.isArray(d.order) ? d.order.filter(x => typeof x === 'string' && known(x)) : [], out.made);
  return {data: out, skipped};
}
// Enthält die Datei keine Favoriten, bleiben die eigenen erhalten.
function importedState(d){
  const res = sanitize(d);
  if (!Array.isArray(d.fav)) {
    const ids = new Set(SEED.map(r => r.id).concat(res.data.made.map(m => m.id)));
    res.data.fav = S.fav.filter(id => ids.has(id));
  }
  return res;
}
function importFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    let d = null;
    try { d = JSON.parse(rd.result); } catch (e) {}
    if (!looksLikeExport(d)) return toast('Das ist keine Export-Datei dieses Handbuchs');
    if (!confirm('Deine Änderungen werden durch die Datei ersetzt. Favoriten bleiben, wenn die Datei keine enthält. Fortfahren?')) return;
    const res = importedState(d);
    S = res.data; openSec.clear(); save(); render();
    toast(res.skipped ? 'Importiert, ' + res.skipped + ' ungültige Einträge übersprungen' : 'Importiert');
  };
  rd.onerror = () => toast('Die Datei konnte nicht gelesen werden');
  rd.readAsText(file);
}

/* ===== Kopieren und Meldungen ===== */
function copy(t){
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject(new Error('kein Zugriff')))
    .then(() => toast('Kopiert'), () => toast('Kopieren blockiert, bitte markieren und Strg+C'));
}
let toastTimer;
function toast(m){ const o = $('#ok'); o.textContent = m; o.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => o.classList.remove('on'), 1400); }

/* ===== Ereignisse: je eine Stelle pro Art, keine Inline-Handler ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) { if (b.tagName === 'A') e.preventDefault(); return act(b.dataset.act, b); }
  const sh = e.target.closest('h4[data-sk]');
  if (sh && !e.target.closest('button,select,input,textarea') && !(editing && editing.el.contains(e.target))) { toggleSec(sh.dataset.rec, sh.dataset.sk); return render(); }
  const h = e.target.closest('h2');
  if (h && h.querySelector('.arw') && !(editing && editing.el.contains(e.target))) { toggleFold(h.parentNode.dataset.rec); return render(); }
  const ml = e.target.closest('.ml.cp');   // nur Zeilen mit /me sind kopierbar
  if (ml && !editing) copy(ml.dataset.raw);
});
document.addEventListener('focusout', e => { if (editing && e.target === editing.el) finishEdit(); });
document.addEventListener('keydown', e => {
  if (editing && e.target === editing.el) {
    if (e.key === 'Enter') { e.preventDefault(); editing.el.blur(); }
    else if (e.key === 'Escape') { editing.cancel = true; editing.el.blur(); }
    return;
  }
  if (e.key === 'Escape' && !editing && (formState || sectionForm)) { formState = null; sectionForm = null; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') setQuery(t.value);
  else if (t.dataset && t.dataset.sf && sectionForm) sectionForm[t.dataset.sf] = t.value;   // Eingaben merken, damit sie beim Neuzeichnen bleiben
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches && t.matches('select[data-blood]')) t.closest('.card').querySelector('.bo').textContent = t.value ? 'Darf Blut erhalten von: ' + BG[t.value].split(' ').join(', ') : '';
  else if (t.matches && t.matches('select[data-smode]')) { setSecMode(t.dataset.id, +t.dataset.s, t.value); render(); }
  else if (t.dataset && t.dataset.sf && sectionForm) sectionForm[t.dataset.sf] = t.value;
  else if (t.id === 'fcat') { formState = Object.assign(readForm(), {text: [], errors: null}); render(); }
  else if (t.id === 'imp') { const f = t.files[0]; t.value = ''; if (f) importFile(f); }   // Auswahl leeren, damit dieselbe Datei erneut gewählt werden kann
});
