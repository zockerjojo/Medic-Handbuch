<script>
/* ===== Grundlagen ===== */
const $ = s => document.querySelector(s);
const TEST = /[?&]test\b/.test(location.search);
const TOP = 't';                                   // Akten ganz oben, ohne Überschrift (früher die Kategorie Narkose)
const C = {t: '', v: 'Vitalwerte & Amnestika', b: 'Behandlungen', o: 'Operationen', m: 'Medikamente'};
const SUBCATS = ['b', 'o', 'm'];                   // Kategorien mit Unterkategorien
const catKey = c => (c === 'n' ? TOP : c);         // alte Kennung „n“ (Narkose) gilt als Akte ganz oben
const cleanT = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 60);   // Name einer Unterkategorie
const RO = {v: 1};                                  // schreibgeschützte Kategorien
const FORM = {m: ['Dosis', 'Wirkung']};             // Formularabschnitte je Kategorie
const DEFAULT_FORM = ['Erkennung', 'Ablauf'];   // Standardabschnitte neuer Akten; die Durchführung ist die /me-Box
const ME_TITLE = 'Durchführung';   // Standardtitel der Hauptbox, im Browser umbenennbar (leer = wieder dieser Titel)
const DIVIDER = '---';   // Trennlinie in einer /me-Liste: eine Zeile mit genau diesem Text, ohne Textstelle und ohne Kopieren
const EKG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4.5l1.8-4.2 3.2 9.2 2.4-7.5 1.6 2.5H22"/></svg>';   // EKG-Symbol neben dem Titel jeder Akte
const EKG = {akte: 'Narkose richtig einleiten', box: 'Überwachung des EKGs'};   // Quelle der Standard-EKG-Überwachung: die /me-Box mit diesem Titel in dieser Akte
const BG = {'AB+': '0- 0+ B- B+ A- A+ AB- AB+', 'AB-': '0- B- A- AB-', 'A+': '0- 0+ A- A+', 'A-': '0- A-', 'B+': '0- 0+ B- B+', 'B-': '0- B-', '0+': '0- 0+', '0-': '0-'};
const KEY = 'medic-handbuch-v2';
const SETKEY = 'medic-handbuch-einstellungen-v2';   // v2: die neuen Standardwerte gelten einmal für alle
const MAT_DEFAULT = '/me nimmt die benötigten Gegenstände aus dem Verbandskasten';   // Material-Zeile neuer Akten
const BRAND = '<h1 class="brand"><svg class="cross" viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--r)" d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg><span>Medic Handbuch</span></h1>';   // Titel mit rotem Kreuz
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const nf = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const clone = x => JSON.parse(JSON.stringify(x));
const lines = t => String(t || '').split('\n').map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
const memStore = () => { const m = {}; return {getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; }}; };

/* ===== Speicher: eine Datei, eine Form, mit Rückgängig-Verlauf ===== */
const fresh = () => ({ov: {}, del: {}, fav: [], order: [], made: [], subs: [], subDel: [], subOf: {}, v: 7});   // v: Stand der Umstellungen (4: Operationen umbenannt, 5: Narkose ganz oben, Unterkategorien, 6: Reihenfolge und Unterkategorien aus akten.json, 7: Lokalanästhesie und Regional-, Plexus- und Spinalanästhesie bei Operationen)
function save(){
  const now = JSON.stringify(S);
  if (lastSaved !== null && now !== lastSaved) {
    if (mergeNext) { if (undoStack.length && undoStack[undoStack.length - 1] === now) undoStack.pop(); }   // Eintippen nach „Zeile hinzufügen“ zählt zum selben Schritt
    else { undoStack.push(lastSaved); if (undoStack.length > 60) undoStack.shift(); }

}
function applyState(json){

}
function orderFix(saved, made = S.made){
  const ids = SEED.map(r => r.id).concat(made.map(r => r.id)), seen = new Set(), out = [];

  return out;
}
// Umbenennungen (Stand 4): alte Kennung → neue Kennung. Gespeicherte Änderungen, Löschungen, Favoriten und Reihenfolge wandern mit.
const RENAMED = {'Narkose einleiten': 'Narkose richtig einleiten', 'Verätzungen': 'Behandlung von Verätzungen', 'Gehirntumor (Wach-OP)': 'Gehirntumor – Wach-OP', 'Korrosion durch SCP-106 (Pocket Dimension)': 'Korrosion - Pocket Dimension (SCP-106)'};
// Stand 7: Lokalanästhesie sowie Regional-, Plexus- und Spinalanästhesie stehen bei Operationen, OP-Grundlagen & Narkose.
// Eine gespeicherte Reihenfolge setzt sie hinter die letzte Akte dieser Unterkategorie. Alle anderen Verschiebungen bleiben.
const STAND7 = ['Lokalanästhesie', 'Regional-, Plexus- und Spinalanästhesie'];
function stand7(order, made = S.made){   // mit vollständiger Reihenfolge: fehlende Akten kommen wie beim Laden dazu
  const ins = STAND7.filter(x => own(BASE, x)), rest = orderFix(order, made).filter(x => !ins.includes(x));
  const grp = ins.length ? DATA_SUBOF[ins[0]] : null;
  let at = -1;
  rest.forEach((x, k) => { if (grp && own(DATA_SUBOF, x) && DATA_SUBOF[x] === grp) at = k; });
  rest.splice(at + 1, 0, ...ins);
  return rest;
}
function migrate(){
  if (!Array.isArray(S.subs)) S.subs = [];   // Unterkategorien, immer vorhanden
  if (!Array.isArray(S.subDel)) S.subDel = [];   // im Browser gelöschte Unterkategorien aus der Datei
  if (!S.subOf || typeof S.subOf !== 'object') S.subOf = {};
  if (S.v >= 7) return;
  if (!(S.v >= 3)) {   // Stand 3: den Abschnitt „Behandlung“ entfernen, auch aus früher gespeicherten Änderungen
    const ohneBeh = secs => (Array.isArray(secs) ? secs.filter(s => s && s.h !== 'Behandlung') : secs);
    Object.keys(S.ov || {}).forEach(k => { if (S.ov[k] && Array.isArray(S.ov[k].sections)) S.ov[k].sections = ohneBeh(S.ov[k].sections); });
    (S.made || []).forEach(m => { m.sections = ohneBeh(m.sections); });
  }
  if (!S.ov) S.ov = {};
  if (!S.del) S.del = {};
  Object.keys(RENAMED).forEach(alt => {   // Stand 4: umbenannte Operationen
    const neu = RENAMED[alt], has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
    if (has(S.ov, alt)) { if (!has(S.ov, neu)) S.ov[neu] = S.ov[alt]; delete S.ov[alt]; }
    if (has(S.del, alt)) { if (!has(S.del, neu)) S.del[neu] = S.del[alt]; delete S.del[alt]; }
    S.fav = (S.fav || []).map(x => (x === alt ? neu : x)).filter((x, i, a) => a.indexOf(x) === i);
    S.order = (S.order || []).map(x => (x === alt ? neu : x));
  });
  if (S.v < 5) {   // Stand 5: die Kategorie Narkose entfällt, ihre Akten stehen ganz oben
    (S.made || []).forEach(m => { if (m.cat === 'n') m.cat = TOP; });
    const istOben = id => { const r = get(id); return !!r && r.cat === TOP; };
    S.order = [...S.order.filter(istOben), ...S.order.filter(x => !istOben(x))];
  }
  if (S.v < 6) resetToData(S);   // Stand 6: Reihenfolge und Unterkategorien aus akten.json, einmal
  if (S.v === 6) S.order = stand7(S.order);   // Stand 7: die beiden Akten zu Operationen, hinter Narkose richtig einleiten
  S.v = 7;
  try { store.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
// Stand 6: Reihenfolge, Unterkategorien und Zuordnungen kommen aus akten.json. Eigene Akten und eigene Unterkategorien bleiben.
function resetToData(st){
  const madeSet = new Set(st.made.map(m => m.id));
  const catOf = id => { const m = st.made.find(x => x.id === id); return m ? m.cat : (BASE[id] ? BASE[id].cat : null); };
  const ids = [...new Set(SEED.map(r => r.id).concat((st.order || []).filter(x => madeSet.has(x))))];
  const oben = x => catOf(x) === TOP;   // Akten ganz oben bleiben an der Spitze
  st.order = [...ids.filter(oben), ...ids.filter(x => !oben(x))];
  st.subs = DATA_GROUPS.map(g => ({id: g.id, cat: g.cat, t: g.t, src: 'd'})).concat(st.subs.filter(s => s.src !== 'd' && !own(DATA_GROUP, s.id)));
  st.subDel = [];
  SEED.forEach(r => { delete st.subOf[r.id]; });   // die Zuordnungen aus der Datei gelten wieder
}
// Unterkategorien aus akten.json in den Browserstand übernehmen: neue dazu, unveränderte Titel nachziehen,
// im Browser gelöschte bleiben weg, aus der Datei entfernte verschwinden.
function syncData(st = S){
  st.subDel = (st.subDel || []).filter(id => own(DATA_GROUP, id));
  st.subs = (st.subs || []).filter(s => s.src !== 'd' || own(DATA_GROUP, s.id));
  DATA_GROUPS.forEach((g, i) => {
    const e = st.subs.find(s => s.id === g.id);
    if (e) { e.src = 'd'; if (!e.ren) { e.t = g.t; e.cat = g.cat; } return; }
    if (st.subDel.includes(g.id)) return;
    // neu aus der Datei: an ihre Stelle, also vor die nächste bekannte Unterkategorie derselben Kategorie, sonst hinter die vorige
    const danach = DATA_GROUPS.slice(i + 1).find(n => n.cat === g.cat && st.subs.some(s => s.id === n.id));
    const davor = DATA_GROUPS.slice(0, i).reverse().find(p => p.cat === g.cat && st.subs.some(s => s.id === p.id));
    const at = danach ? st.subs.findIndex(s => s.id === danach.id) : davor ? st.subs.findIndex(s => s.id === davor.id) + 1 : st.subs.length;
    st.subs.splice(at, 0, {id: g.id, cat: g.cat, t: g.t, src: 'd'});

}
function load(){ loadRaw(); migrate(); syncData(); S.order = orderFix(S.order); lastSaved = JSON.stringify(S); }
function loadRaw(){
  S = fresh();
  let raw = null;
  try { raw = store.getItem(KEY); } catch (e) {}
  if (raw) { try { const p = JSON.parse(raw); Object.assign(S, p); if (!p || typeof p.v !== 'number') S.v = 0; } catch (e) { S = fresh(); } }   // ohne Stand: alle Umstellungen prüfen
  else { // bisherige Version: Kennung = Titel, daher keine Umwandlung nötig
    try { S.fav = JSON.parse(store.getItem('f')) || []; } catch (e) {}
    try { const me = JSON.parse(store.getItem('me')) || {}; Object.keys(me).forEach(t => { if (BASE[t]) S.ov[t] = {me: me[t]}; }); } catch (e) {}
  }
  undoStack = []; redoStack = []; mergeNext = false;
}

/* ===== Akten lesen und ändern (immer kopierend, nie die Grunddaten verändern) ===== */
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const withKeys = secs => (secs || []).map((s, i) => (s.k ? s : Object.assign({}, s, {k: 'b' + i})));
const validBox = b => Array.isArray(b) ? b.every(t => typeof t === 'string')   // alte Form: nur die Zeilen
  : (!!b && typeof b === 'object' && (b.t === undefined || typeof b.t === 'string') && Array.isArray(b.me) && b.me.every(t => typeof t === 'string'));
const normBox = b => {   // feste Form; die Kennung k hält den Einklappzustand der Box und folgt ihr bei Verschiebungen
  const o = Array.isArray(b) ? {t: '', me: b.filter(t => typeof t === 'string')}
    : {t: (b && typeof b.t === 'string') ? b.t.trim() : '', me: (b && Array.isArray(b.me) ? b.me : []).filter(t => typeof t === 'string')};
  if (b && !Array.isArray(b) && typeof b.k === 'string' && b.k) o.k = b.k;
  return o;
};
const boxesOf = r => (r && Array.isArray(r.boxes) ? r.boxes.map(normBox) : []).map((b, i) => (b.k ? b : Object.assign(b, {k: 'x' + i})));   // zusätzliche /me-Boxen einer Akte, immer frische Kopien, jede mit Kennung
const boxAt = s => (/^x\d+$/.test(s) ? +s.slice(1) : -1);   // 'x0', 'x1' … = zusätzliche Box Nr. 0, 1 …
const get = id => {
  const m = S.made.find(r => r.id === id);
  if (m) return Object.assign({}, m, {sections: withKeys(m.sections)});
  if (!BASE[id]) return null;
  const o = S.ov[id] || {};
  return Object.assign({}, BASE[id], o, {sections: withKeys(o.sections || BASE[id].sections)});
};
const all = () => S.order.map(get).filter(Boolean);
const live = () => all().filter(r => !S.del[r.id]);
const trashed = () => all().filter(r => S.del[r.id]);
function patch(id, field, value){
  const m = S.made.find(r => r.id === id);
  if (m) m[field] = value;
  else if (BASE[id]) (S.ov[id] = S.ov[id] || {})[field] = value;
  else return;
  save();
}
function setText(id, path, text){
  const r = get(id), p = path.split(':');
  if (!r) return;
  if (p[0] === 'title') { if (text) patch(id, 'title', text); }
  else if (p[0] === 'desc') patch(id, 'desc', text);
  else if (p[0] === 'mt') { if (text) patch(id, 'meTitle', text); else clearField(id, 'meTitle'); }   // Titel der Hauptbox; leer = wieder „Durchführung“
  else if (p[0] === 'm') {
    const me = r.me.slice();
    if (!text || text === '/me' || text === 'Notiz:') me.splice(+p[1], 1); else me[+p[1]] = text;
    patch(id, 'me', me);
  } else if (p[0] === 'x') {   // zusätzliche /me-Boxen, Pfad x:Box:Zeile
    const boxes = boxesOf(r), bi = +p[1];
    if (!boxes[bi]) return;
    const me = boxes[bi].me;
    if (!text || text === '/me' || text === 'Notiz:') me.splice(+p[2], 1); else me[+p[2]] = text;
    patch(id, 'boxes', boxes);
  } else if (p[0] === 'xt') {   // Titel einer zusätzlichen Box, Pfad xt:Box
    const boxes = boxesOf(r), bi = +p[1];
    if (!boxes[bi] || !text) return;
    boxes[bi].t = text;
    patch(id, 'boxes', boxes);
  } else {
    const secs = clone(r.sections), s = secs[+p[1]];
    if (p[0] === 'h') { if (text) s.h = text; }
    else if (!text) s.items.splice(+p[2], 1);
    else s.items[+p[2]] = text;
    patch(id, 'sections', secs.filter(x => x.items.length));
  }
}
function move(id, s, i, d){
  const r = get(id), j = i + d;
  const swap = arr => { if (j < 0 || j >= arr.length) return false; [arr[i], arr[j]] = [arr[j], arr[i]]; return true; };
  if (s === 'm') { const me = r.me.slice(); if (swap(me)) patch(id, 'me', me); }
  else if (boxAt(s) >= 0) { const boxes = boxesOf(r), bi = boxAt(s); if (boxes[bi] && swap(boxes[bi].me)) patch(id, 'boxes', boxes); }
  else { const secs = clone(r.sections); if (swap(secs[s].items)) patch(id, 'sections', secs); }
}
function removeLine(id, s, i){
  if (s === 'm') return patch(id, 'me', get(id).me.filter((_, k) => k !== i));
  if (boxAt(s) >= 0) { const boxes = boxesOf(get(id)), bi = boxAt(s); if (boxes[bi]) { boxes[bi].me.splice(i, 1); patch(id, 'boxes', boxes); } return; }
  const secs = clone(get(id).sections);
  secs[s].items.splice(i, 1);
  patch(id, 'sections', secs.filter(x => x.items.length));
}
function addLine(id, s, start){
  if (s === 'm') { const me = get(id).me.concat(start || '/me '); patch(id, 'me', me); mergeNext = true; return 'm:' + (me.length - 1); }
  if (boxAt(s) >= 0) { const boxes = boxesOf(get(id)), bi = boxAt(s); if (!boxes[bi]) return null; const n = boxes[bi].me.push(start || '/me ') - 1; patch(id, 'boxes', boxes); mergeNext = true; return 'x:' + bi + ':' + n; }
  const secs = clone(get(id).sections), n = secs[s].items.push('Neue Zeile') - 1;
  patch(id, 'sections', secs);
  mergeNext = true;
  return 'i:' + s + ':' + n;
}
function addBox(id){   // neue zusätzliche /me-Box mit Titel und einer Zeile; gibt den Pfad dieser Zeile zurück
  const boxes = boxesOf(get(id)), k = newKey();
  boxes.push({t: 'Zusätzliche Box', me: ['/me '], k});
  patch(id, 'boxes', boxes); mergeNext = true;
  boxOv.set(id + '|' + k, true);   // eine neue Box ist offen, auch wenn die Grundeinstellung eingeklappt ist
  return 'x:' + (boxes.length - 1) + ':0';
}
function removeBox(id, bi){

// Die Hauptbox (Durchführung) lässt sich wie jede andere Box entfernen. Ihre Zeilen bleiben erhalten und kommen mit „wieder hinzufügen“ zurück.
function removeMainBox(id){ patch(id, 'meOff', true); }

function addDivider(id, s){   // Trennlinie als eigener Eintrag ans Ende der /me-Liste (Hauptbox oder zusätzliche Box), ohne Textfeld

function delSection(id, s){ const secs = clone(get(id).sections); secs.splice(s, 1); patch(id, 'sections', secs); }
/* ===== Unterkategorien (Behandlungen, Operationen, Medikamente): Titel, Trennlinien, Reihenfolge ===== */
let subForm = null;   // offenes Eingabefeld in der Sidebar: {cat, id (leer = neu), val}
const newSubId = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const subsOf = k => S.subs.filter(s => s.cat === k);

const subOfRec = r => { const sid = !r ? '' : own(S.subOf, r.id) ? S.subOf[r.id] : (own(DATA_SUBOF, r.id) ? DATA_SUBOF[r.id] : ''); return sid ? (S.subs.find(s => s.id === sid && s.cat === r.cat) || null) : null; };

function placeAt(id, cat, sid){   // ans Ende der Gruppe (Kategorie und Unterkategorie), sonst ans Ende der Kategorie, sonst ans Ende der Liste

function subCheck(cat, t, selfId){   // leer = in Ordnung, sonst die Meldung

function subAdd(cat, t){

function subMove(id, d){   // Reihenfolge der Unterkategorien innerhalb ihrer Kategorie

function navLink(r){   // Akte in der Sidebar; im Bearbeitungsmodus mit ▲▼ zum Verschieben

function render(){

    if (p.path) { const el = [...document.querySelectorAll('.tx')].find(x => x.dataset.rec === p.id && x.dataset.path === p.path); if (el) startEdit(el); }

/* ===== Bearbeiten: ein Mechanismus für alle Textstellen ===== */
function startEdit(el){
  if (editing) {   // eine andere Stelle ist noch offen: erst abschließen, dann die angeklickte Stelle in der neu gezeichneten Anzeige suchen
    const rec = el.dataset.rec, path = el.dataset.path;
    finishEdit();
    el = [...document.querySelectorAll('.tx')].find(x => x.dataset.rec === rec && x.dataset.path === path);
    if (!el) return;
  }
  if (el.dataset.path.indexOf('i:') === 0) el = lineArea(el);   // Zeilen in Abschnitten sind mehrzeilig: Shift + Enter setzt einen Zeilenumbruch
  editing = {el, cancel: false};
  if (el.tagName === 'TEXTAREA') { fit(el); el.focus(); el.select(); return; }
  el.contentEditable = 'true'; el.classList.add('ed');
  el.textContent = el.dataset.raw; el.focus();
  const rg = document.createRange(); rg.selectNodeContents(el);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg);
}
function lineArea(el){   // Zeile eines Abschnitts: die Anzeige wird durch ein Textfeld ersetzt, das mehrere Zeilen halten kann
  const ta = document.createElement('textarea');
  ta.className = 'tx-ta'; ta.rows = 1; ta.value = el.dataset.raw; ta.setAttribute('aria-label', 'Zeile bearbeiten');
  ta.dataset.rec = el.dataset.rec; ta.dataset.path = el.dataset.path; ta.dataset.raw = el.dataset.raw;
  ta.addEventListener('input', () => fit(ta));
  el.replaceWith(ta);
  return ta;
}
function fit(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }   // das Textfeld wächst mit dem Text
function finishEdit(){
  if (!editing) return;
  const {el, cancel} = editing; editing = null;
  const area = el.tagName === 'TEXTAREA';   // mehrzeilige Abschnittszeile
  if (!area) { el.contentEditable = 'false'; el.classList.remove('ed'); }
  if (!cancel) { const t = area ? cleanLines(el.value) : el.textContent.replace(/\s+/g, ' ').trim(); if (t !== el.dataset.raw) setText(el.dataset.rec, el.dataset.path, t); }
  render();
}

/* ===== Aktionen: ein Handler für alle Schaltflächen (data-act) ===== */
function openRec(id){
  const r = get(id);
  if (!r) return;
  const next = S.del[id] ? 'trash' : r.cat;
  if (next !== view) { folded.clear(); secOv.clear(); boxOv.clear(); }
  folded.delete(id); clearSecs(id); clearBoxes(id);
  view = next; query = ''; $('#q').value = ''; opened.add(r.cat); sectionForm = null; subForm = null;
  pending = {id}; render();
}
function setQuery(v){ query = v; folded.clear(); render(); }
function toggleFold(id){ if (folded.has(id)) { folded.delete(id); clearSecs(id); clearBoxes(id); } else folded.add(id); }
function toggleSec(id, k){ secOv.set(id + '|' + k, !secOpen(id, k)); }
function openSecAt(id, si){ const r = get(id), s = r && r.sections[si]; if (s) secOv.set(id + '|' + s.k, true); }
function clearSecs(id){ [...secOv.keys()].forEach(k => { if (k.startsWith(id + '|')) secOv.delete(k); }); }
function focusField(sel){ const t = document.querySelector(sel); if (t) t.focus(); }
function newKey(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function moveSection(id, si, d){
  const secs = clone(get(id).sections), j = si + d;

/* ===== Rückgängig und Wiederholen ===== */
function undo(){

  if (!undoStack.length) return render();

}
function redo(){

}

const EDIT_ONLY = new Set(['edit', 'trash', 'restore', 'purge', 'reset', 'recmove', 'move', 'secmove', 'remove', 'add', 'adddiv', 'delsec', 'addbox', 'rmbox', 'rmmain', 'addmain', 'boxmove', 'newform', 'secform', 'secsave', 'create', 'import', 'importakte', 'undo', 'redo', 'subnew', 'subedit', 'subcancel', 'subok', 'submove', 'subdel', 'resetall']);   // nur im Bearbeitungsmodus
function act(name, b){
  if (EDIT_ONLY.has(name) && !EDIT) return;   // Zuschauermodus: nichts ändern, nichts hinzufügen
  const d = b.dataset, id = d.id;
  if (name === 'edit') return startEdit(b.closest('[data-hold]').querySelector('.tx'));
  if (name === 'go') return openRec(id);
  if (name === 'toggle') { if (opened.has(d.v)) opened.delete(d.v); else opened.add(d.v); return renderNav(); }
  if (name === 'create') return submit();
  if (name === 'export') return exportData();
  if (name === 'ekg') return openEkg();
  if (name === 'import') return $('#imp').click();
  if (name === 'mode') return setMode(!EDIT);
  if (name === 'navtoggle') { SET.nav = SET.nav === 'open' ? 'closed' : 'open'; saveSet(); return applySet(); }
  if (name === 'exportrec') return exportAkte(id);
  if (name === 'importakte') return $('#impakte').click();
  if (name === 'fold') { toggleFold(id); return render(); }
  if (name === 'secopen') { toggleSec(id, d.sk); return render(); }
  if (name === 'boxopen') { toggleBox(id, d.bk); return render(); }
  if (name === 'undo') return undo();
  if (name === 'redo') return redo();
  if (name === 'settings') return openModal();
  if (name === 'closemodal') return closeModal();
  if (name === 'set') return setOpt(d.k, d.v);
  if (name === 'view') { view = d.v; query = ''; $('#q').value = ''; folded.clear(); secOv.clear(); boxOv.clear(); sectionForm = null; subForm = null; if (C[d.v]) opened.add(d.v); }
  else if (name === 'fav') fav(id);
  else if (name === 'move') move(id, d.s, +d.i, +d.d);
  else if (name === 'secmove') moveSection(id, +d.s, +d.d);
  else if (name === 'remove') removeLine(id, d.s, +d.i);
  else if (name === 'add') { if (/^\d+$/.test(d.s)) openSecAt(id, +d.s); pending = {id, path: addLine(id, d.s, d.start)}; }
  else if (name === 'adddiv') addDivider(id, d.s);
  else if (name === 'addbox') pending = {id, path: addBox(id)};
  else if (name === 'rmbox') removeBox(id, +d.b);
  else if (name === 'rmmain') removeMainBox(id);
  else if (name === 'addmain') restoreMainBox(id);
  else if (name === 'boxmove') moveBox(id, +d.b, +d.d);
  else if (name === 'delsec') delSection(id, +d.s);
  else if (name === 'recmove') moveRec(id, +d.d);
  else if (['subnew', 'subedit', 'subcancel', 'subok', 'submove', 'subdel'].includes(name)) subAct(name, d);
  else if (name === 'trash') trash(id);
  else if (name === 'restore') restore(id);
  else if (name === 'purge') { if (confirm('Akte endgültig löschen? Das lässt sich nicht rückgängig machen.')) purge(id); }
  else if (name === 'reset') { if (confirm('Eigene Änderungen an dieser Akte verwerfen?')) reset(id); }
  else if (name === 'resetall') { if (confirm('Alle mitgelieferten Akten auf den Originalzustand zurücksetzen?\n\nDeine Änderungen an diesen Akten gehen verloren (Texte, Abschnitte, /me-Boxen, Reihenfolge, Unterkategorien). Mitgelieferte Akten im Papierkorb kommen zurück. Eigene Akten, eigene Unterkategorien und Favoriten bleiben erhalten. Mit Strg+Z lässt sich das rückgängig machen.')) { resetStandard(); closeModal(); toast('Mitgelieferte Akten sind wieder im Originalzustand'); } }
  else if (name === 'newform') formState = formState ? null : {cat: (C[view] && !RO[view]) ? view : 'b', title: '', desc: '', text: [], sub: '', newSub: ''};
  else if (name === 'closeform') formState = null;
  else if (name === 'secform') sectionForm = (sectionForm && sectionForm.id === id) ? null : {id, name: '', text: '', mode: 'bullet', errors: null};
  else if (name === 'secsave') {
    if (sectionForm) {
      const res = addSection(id, sectionForm.name, sectionForm.text, sectionForm.mode);
      if (res.errors) sectionForm.errors = res.errors;
      else { secOv.set(id + '|' + res.k, true); sectionForm = null; toast('Abschnitt hinzugefügt'); }
    }
  }
  else if (name === 'seccancel') sectionForm = null;
  render();
  if (name === 'newform' && formState) focusField('#ftitle');

  if (name === 'secform' && sectionForm) focusField('[data-sf="name"]');
}

/* ===== Abschnitt hinzufügen: frei gewählter Name, Darstellung, mindestens eine Zeile ===== */
function addSection(id, name, text, mode){
  const r = get(id), n = cleanText(name), items = lines(text), e = {};
  if (!r || RO[r.cat]) return {errors: {name: 'Bei dieser Akte lassen sich keine Abschnitte hinzufügen.'}};
  if (!n) e.name = 'Bitte einen Namen eingeben.';
  else if (n.length > 60) e.name = 'Der Name darf höchstens 60 Zeichen lang sein.';
  else if (r.sections.some(s => nf(s.h) === nf(n))) e.name = 'Einen Abschnitt mit diesem Namen gibt es schon.';
  if (!items.length) e.text = 'Mindestens eine Zeile eingeben.';
  if (Object.keys(e).length) return {errors: e};
  const secs = clone(r.sections), k = newKey();
  secs.push({h: n, items, mode: own(MODES, mode) ? mode : 'bullet', k});
  patch(id, 'sections', secs);
  return {ok: true, k};
}

/* ===== Import: jede Angabe wird geprüft, ungültige Teile werden übersprungen ===== */
const cleanText = t => (typeof t === 'string' ? t.replace(/\s+/g, ' ').trim() : '');
const cleanLines = t => (typeof t === 'string' ? t.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean).join('\n') : '');   // Zeilenumbrüche bleiben, Leerzeichen am Rand und Leerzeilen fallen weg
function looksLikeExport(d){
  return !!d && typeof d === 'object' && !Array.isArray(d) && ['ov', 'del', 'fav', 'made', 'order'].some(k => k in d);
}
function cleanSections(x){
  const out = [];
  (Array.isArray(x) ? x : []).forEach(s => {
    if (!s || typeof s !== 'object') return;
    const h = cleanText(s.h), items = (Array.isArray(s.items) ? s.items : []).filter(t => typeof t === 'string' && t.trim()).map(t => t.trim());
    if (!h || !items.length) return;
    const o = {h, items};
    if (typeof s.k === 'string' && s.k) o.k = s.k;
    if (own(MODES, s.mode)) o.mode = s.mode;
    out.push(o);
  });
  return out;
}
function cleanBoxes(x){ return (Array.isArray(x) ? x : []).filter(validBox).map(normBox); }
function cleanMade(x, seen){
  if (!x || typeof x !== 'object' || !Array.isArray(x.sections)) return null;
  const id = typeof x.id === 'string' ? x.id.trim() : '', title = cleanText(x.title);
  const cat = catKey(x.cat);
  if (!id || own(BASE, id) || seen.has(id) || !own(C, cat) || RO[cat] || !title) return null;
  const out = {id, cat, title, desc: typeof x.desc === 'string' ? x.desc : '', kw: '', sections: cleanSections(x.sections),
    me: Array.isArray(x.me) ? x.me.filter(t => typeof t === 'string') : [], boxes: cleanBoxes(x.boxes), table: null, widget: false};
  const mt = cleanText(x.meTitle); if (mt) out.meTitle = mt;   // eigener Titel der Hauptbox
  if (x.meOff === true) out.meOff = true;   // Hauptbox entfernt
  return out;
}
function cleanOv(x){
  const o = {};
  if (!x || typeof x !== 'object') return o;
  const t = cleanText(x.title); if (t) o.title = t;
  const mt = cleanText(x.meTitle); if (mt) o.meTitle = mt;
  if (x.meOff === true) o.meOff = true;
  if (typeof x.desc === 'string') o.desc = x.desc;
  if (Array.isArray(x.me)) o.me = x.me.filter(v => typeof v === 'string');
  if (Array.isArray(x.boxes)) o.boxes = cleanBoxes(x.boxes);
  if (Array.isArray(x.sections)) o.sections = cleanSections(x.sections);
  return o;
}
function sanitize(d){
  const out = fresh(), seen = new Set();
  let skipped = 0;
  if (Array.isArray(d.made)) d.made.forEach(x => {
    const m = cleanMade(x, seen);
    if (m) { seen.add(m.id); out.made.push(m); } else skipped++;
  });
  const known = id => own(BASE, id) || seen.has(id);
  if (d.ov && typeof d.ov === 'object') Object.keys(d.ov).forEach(k => {
    if (!own(BASE, k)) { skipped++; return; }
    const o = cleanOv(d.ov[k]);
    if (Object.keys(o).length) out.ov[k] = o;
  });
  if (d.del && typeof d.del === 'object') Object.keys(d.del).forEach(k => { if (known(k)) out.del[k] = 1; else skipped++; });
  if (Array.isArray(d.fav)) out.fav = [...new Set(d.fav.filter(x => typeof x === 'string' && known(x)))];
  out.order = orderFix(Array.isArray(d.order) ? d.order.filter(x => typeof x === 'string' && known(x)) : [], out.made);
  if (Array.isArray(d.subs)) d.subs.forEach(s => {   // Unterkategorien: nur gültige, je Kategorie ein Name
    const t = cleanT(s && s.t), c = s && s.cat;
    if (s && typeof s.id === 'string' && s.id && SUBCATS.includes(c) && t && !out.subs.some(x => x.id === s.id || (x.cat === c && nf(x.t) === nf(t)))) {
      const g = {id: s.id, cat: c, t};
      if (s.src === 'd') g.src = 'd';   // aus akten.json übernommen
      if (s.ren === true) g.ren = true;   // dort umbenannt
      out.subs.push(g);
    }
  });
  if (Array.isArray(d.subDel)) out.subDel = [...new Set(d.subDel.filter(x => typeof x === 'string' && x))];
  if (d.subOf && typeof d.subOf === 'object') Object.keys(d.subOf).forEach(k => {   // Zuweisungen nur, wenn Akte und Unterkategorie zusammenpassen; „ohne“ (leer) bleibt
    const rec = out.made.find(m => m.id === k) || (own(BASE, k) ? BASE[k] : null), sid = d.subOf[k];
    if (rec && typeof sid === 'string' && (sid === '' || out.subs.some(s => s.id === sid && s.cat === rec.cat))) out.subOf[k] = sid;
  });
  return {data: out, skipped};
}
// Enthält die Datei keine Favoriten, bleiben die eigenen erhalten.
function importedState(d){
  const res = sanitize(d);
  if (!Array.isArray(d.fav)) {
    const ids = new Set(SEED.map(r => r.id).concat(res.data.made.map(m => m.id)));
    res.data.fav = S.fav.filter(id => ids.has(id));
  }
  if (!(Number(d.v) >= 6)) resetToData(res.data);   // ältere Stände: Reihenfolge und Unterkategorien aus akten.json
  if (Number(d.v) === 6) res.data.order = stand7(res.data.order, res.data.made);   // Stand 6: die beiden Akten zu Operationen
  syncData(res.data);
  return res;
}
function importFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    let d = null;
    try { d = JSON.parse(rd.result); } catch (e) {}
    if (d && d.format === 'medic-akte') return importAkteDaten(d);   // eine einzelne Akte, auch über „Importieren“
    if (!looksLikeExport(d)) return toast('Das ist keine Export-Datei dieses Handbuchs');
    if (!confirm('Deine Änderungen werden durch die Datei ersetzt. Favoriten bleiben, wenn die Datei keine enthält. Fortfahren?')) return;
    const res = importedState(d);
    S = res.data; secOv.clear(); boxOv.clear(); subForm = null; save(); render();
    toast(res.skipped ? 'Importiert, ' + res.skipped + ' ungültige Einträge übersprungen' : 'Importiert');
  };
  rd.onerror = () => toast('Die Datei konnte nicht gelesen werden');
  rd.readAsText(file);
}

  }

    if (e.key === 'Enter') { e.preventDefault(); subCommit(); render(); if (subForm) focusField('#subin'); }
    else if (e.key === 'Escape') { subForm = null; render(); }
    return;
  }
  if (fmtKey(e) && e.target.matches && e.target.matches('textarea[data-sf="text"]')) { e.preventDefault(); return fmtWrap(e.target, fmtKey(e)); }   // Strg+B und Strg+U auch im Feld für neue Abschnitte
  const typing = e.target.matches && e.target.matches('input,textarea,select,[contenteditable="true"]');

    if (k === 'z' && !e.shiftKey) { e.preventDefault(); return undo(); }
    if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); return redo(); }

  else if (t.id === 'imp') { const f = t.files[0]; t.value = ''; if (f) importFile(f); }   // Auswahl leeren, damit dieselbe Datei erneut gewählt werden kann
  else if (t.id === 'impakte') { const f = t.files[0]; t.value = ''; if (f) importAkteFile(f); }   // eine einzelne Akte aus einer Datei
  else if (t.id === 'datafile') { const f = t.files[0]; if (f) loadDataFile(f); }          // akten.json von Hand auswählen (Fallback)
});

/* ===== Start: akten.json laden, prüfen, dann anzeigen ===== */
// Pfad zur Datei, relativ zur Seite berechnet: funktioniert auch in einem Unterordner (z. B. GitHub Pages unter /repo/)
const DATA_URL = new URL('./akten.json', document.baseURI).href;
async function boot(){
  loadSet(); applySet();
  $('#l').innerHTML = '<p class="empty">Akten werden geladen …</p>';
  let text;
  try {
    const r = await fetch(DATA_URL, {cache: 'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status + ' – die Datei fehlt oder liegt nicht im selben Ordner wie index.html.');
    text = await r.text();
  } catch (e) { return dataError(location.protocol === 'file:' ? 'Die Datei akten.json fehlt oder kann nicht geladen werden.' : 'akten.json konnte nicht geladen werden: ' + e.message, true); }
  parseAndStart(text);
}
function parseAndStart(text){
  let raw;
  try { raw = JSON.parse(text); }
  catch (e) { return dataError('akten.json ist kein gültiges JSON: ' + e.message, true); }
  startWith(parseData(raw));
}
function startWith(res){
  if (!res.records.length) return dataError('Es wurde keine gültige Akte gefunden.', true, res.problems);
  applyData(res);
  load(); render();
  if (TEST) runTests();
}
function dataError(msg, offerFile, problems = []){
  $('#n').innerHTML = BRAND;
  const local = location.protocol === 'file:' ? '<p>Du öffnest die Seite direkt von der Festplatte. Dabei darf der Browser akten.json nicht laden. Lade die Datei unten hoch, oder öffne die Seite über einen Webserver, zum Beispiel GitHub Pages.</p>' : '';
  const list = problems.length ? `<ul>${problems.slice(0, 12).map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : '';
  const pick = offerFile ? '<p><label>akten.json auswählen <input type="file" id="datafile" accept=".json,application/json"></label></p>' : '';
  $('#l').innerHTML = `<div class="errbox"><h3>Die Akten konnten nicht geladen werden</h3><p>${esc(msg)}</p>${local}${list}${pick}</div>`;
}
function loadDataFile(file){
  const rd = new FileReader();
  rd.onload = () => parseAndStart(String(rd.result));
  rd.onerror = () => dataError('Die Datei konnte nicht gelesen werden.', true);
  rd.readAsText(file);
}

    redo(); ok(S.subs.some(s => s.t === 'Rückgängig-Gruppe'), 'nicht wiederhergestellt');
  });
  T('Endgültiges Löschen entfernt die Zuordnung, die Unterkategorie bleibt', () => {
    reset0();
    const sid = subAdd('m', 'Lösch-Test').id;
    const r = create({cat: 'm', title: 'Endgültig weg', sub: sid, sections: [{h: 'Wirkung', text: 'x'}]}).id;
    trash(r); purge(r);
    ok(!own(S.subOf, r) && S.subs.some(s => s.id === sid) && !S.made.some(m => m.id === r), 'Zuordnung oder Unterkategorie falsch');
  });
  // ===== Unterkategorien aus akten.json (Stand 6) =====
  T('Neuer Browserstand startet auf Stand 7 mit leerer Löschliste', () => { const f = fresh(); ok(f.v === 7 && Array.isArray(f.subDel) && f.subDel.length === 0, 'Stand falsch'); });
  T('Die Datei legt Unterkategorien fest: jede steht vor ihren Akten', () => {
    const akte = t => ({id: t, cat: 'b', title: t, sections: [{h: 'Erkennung', items: ['x']}]});
    const p = parseData([
      {typ: 'unterkategorie', id: 'g1', cat: 'b', title: 'Eins'}, akte('A'), akte('B'),
      {typ: 'unterkategorie', id: 'g2', cat: 'b', title: 'Zwei'}, akte('C'),
      {id: 'D', cat: 'v', title: 'D', sections: [{h: 'Erkennung', items: ['x']}]}, akte('E')
    ]);
    ok(p.groups.map(g => g.id).join() === 'g1,g2' && p.problems.length === 0, 'Gruppen: ' + JSON.stringify(p.groups) + ' ' + p.problems.join(' | '));
    ok(p.subOf.A === 'g1' && p.subOf.B === 'g1' && p.subOf.C === 'g2', 'Zuordnung: ' + JSON.stringify(p.subOf));
    ok(!('D' in p.subOf) && !('E' in p.subOf), 'Akte nach einer fremden Kategorie hängt noch an einer Gruppe');
  });
  T('Ungültige Unterkategorien aus der Datei werden übersprungen', () => {
    const akte = {id: 'R', cat: 'o', title: 'R', sections: [{h: 'Ablauf', items: ['x']}]};
    const p = parseData([
      {typ: 'unterkategorie', id: 'x1', cat: 'v', title: 'Falsche Kategorie'},
      {typ: 'unterkategorie', id: 'x2', cat: 'b', title: '   '},
      {typ: 'unterkategorie', id: 'x3', cat: 'o', title: 'Gut'}, akte,
      {typ: 'unterkategorie', id: 'x3', cat: 'b', title: 'Doppelte Kennung'},
      {typ: 'unterkategorie', id: 'x4', cat: 'o', title: 'gut'}
    ]);
    ok(p.groups.length === 1 && p.groups[0].id === 'x3', 'Gruppen: ' + JSON.stringify(p.groups));
    ok(p.problems.length === 4, 'Meldungen: ' + p.problems.join(' | '));
    ok(p.subOf.R === 'x3', 'Akte nicht bei der gültigen Gruppe');
  });
  T('Gruppen aus der Datei stehen im Browser, Akten folgen der Datei', () => {
    reset0(); load();
    ok(DATA_GROUPS.length > 0 && DATA_GROUPS.every(g => S.subs.some(s => s.id === g.id && s.src === 'd')), 'Gruppen fehlen im Browserstand');
    const r = SEED.find(x => own(DATA_SUBOF, x.id));
    ok(r && (subOfRec(get(r.id)) || {}).id === DATA_SUBOF[r.id], 'Akte nicht in der Gruppe aus der Datei');
    reset0();
  });
  T('Eigene Zuordnung bleibt beim Neuladen, „ohne“ fällt nicht auf die Datei zurück', () => {
    reset0(); load();
    const r = SEED.find(x => own(DATA_SUBOF, x.id)), anders = S.subs.find(s => s.cat === r.cat && s.id !== DATA_SUBOF[r.id]);
    setRecSub(r.id, anders.id); load();
    ok((subOfRec(get(r.id)) || {}).id === anders.id, 'Verschiebung beim Neuladen verloren');
    setRecSub(r.id, ''); load();
    ok(!subOfRec(get(r.id)), '„ohne“ beim Neuladen auf die Datei zurückgefallen');
    reset0();
  });
  T('Im Browser gelöschte Gruppe aus der Datei kommt beim Neuladen nicht zurück', () => {
    reset0(); load();
    const g = DATA_GROUPS.find(x => SEED.some(r => DATA_SUBOF[r.id] === x.id)), akte = SEED.find(r => DATA_SUBOF[r.id] === g.id);
    subDelete(g.id); load();
    ok(!S.subs.some(s => s.id === g.id) && S.subDel.includes(g.id), 'Gruppe ist nach dem Neuladen wieder da');
    ok(!subOfRec(get(akte.id)), 'Akte hängt noch an der gelöschten Gruppe');
    reset0();
  });
  T('Umbenannte Gruppe behält ihren Titel, auch wenn sich die Datei ändert', () => {
    reset0(); load();
    const o = DATA_GROUPS.find(x => x.cat === 'o'), m = DATA_GROUPS.find(x => x.cat === 'm'), altO = o.t, altM = m.t;
    try {
      subRename(o.id, 'Eigener Name');
      o.t = 'Neuer Dateititel'; m.t = 'Geänderter Dateititel'; syncData();
      ok(S.subs.find(s => s.id === o.id).t === 'Eigener Name', 'Browser-Titel überschrieben');
      ok(S.subs.find(s => s.id === m.id).t === 'Geänderter Dateititel', 'Titel aus der Datei nicht übernommen');
    } finally { o.t = altO; m.t = altM; }
    reset0();
  });
  T('Aus der Datei entfernte Gruppe verschwindet im Browser', () => {
    reset0(); load();
    const alle = DATA_GROUPS, karte = DATA_GROUP, weg = alle[alle.length - 1];
    DATA_GROUPS = alle.filter(g => g !== weg); DATA_GROUP = {}; DATA_GROUPS.forEach(g => { DATA_GROUP[g.id] = g; });
    try { syncData(); ok(!S.subs.some(s => s.id === weg.id), 'entfernte Gruppe steht noch im Browser'); }
    finally { DATA_GROUPS = alle; DATA_GROUP = karte; }
    reset0();
  });
  T('Stand 7: Lokalanästhesie und Regional-, Plexus- und Spinalanästhesie bleiben bei OP-Grundlagen, auch bei gespeicherter Reihenfolge', () => {
    reset0(); syncData();
    const alle = SEED.map(r => r.id), neu = STAND7.filter(x => alle.includes(x));
    S.v = 6; S.order = [...neu, ...alle.filter(x => !neu.includes(x)).reverse()];   // so sieht ein Stand 6 aus: die beiden oben
    const vorher = S.order.filter(x => !neu.includes(x));
    migrate();
    const o1 = sidebarOrder('o', live().filter(r => r.cat === 'o')).filter(r => (subOfRec(r) || {}).id === 'o1').map(r => r.id);
    ok(S.v === 7, 'Stand nicht gesetzt');
    ok(S.order.filter(x => !neu.includes(x)).join('|') === vorher.join('|'), 'andere Verschiebungen verändert');
    ok(o1.join('|') === 'Narkose richtig einleiten|Lokalanästhesie|Regional-, Plexus- und Spinalanästhesie', o1.join('|'));
    reset0();
  });
  T('Stand 7: die Reihenfolge eines Stand-6-Imports stimmt auch', () => {
    reset0();
    const o = importedState({v: 6, order: [...STAND7, ...SEED.map(r => r.id).filter(x => !STAND7.includes(x))]}).data.order;
    reset0();
    const a = o.indexOf('Narkose richtig einleiten'), b = o.indexOf('Lokalanästhesie'), c = o.indexOf('Regional-, Plexus- und Spinalanästhesie');
    ok(a >= 0 && a < b && b < c, 'Import: ' + [a, b, c].join(','));
  });
  T('Eine Unterkategorie, die die Datei neu hat, erscheint an ihrer Stelle', () => {
    reset0(); load();
    const soll = DATA_GROUPS.filter(g => g.cat === 'o').map(g => g.id).join('|');
    const neu = DATA_GROUPS.find(g => g.t === 'Intraoperative Komplikationen & Notfälle').id;
    S.subs = S.subs.filter(s => s.id !== neu);   // so sieht ein Browserstand aus, der diese Unterkategorie noch nicht kennt
    syncData();
    const ist = subsOf('o').map(s => s.id).join('|');
    reset0();
    ok(ist === soll, 'Reihenfolge: ' + ist);
  });
  T('Starke innere Blutung steht in der Unterkategorie Intraoperative Komplikationen & Notfälle', () => {
    const r = SEED.find(x => x.title === 'Starke innere Blutung (Intraoperativ)');
    const g = r && DATA_SUBOF[r.id] ? DATA_GROUP[DATA_SUBOF[r.id]] : null;
    ok(r && r.cat === 'o' && g && g.t === 'Intraoperative Komplikationen & Notfälle', 'falsche Unterkategorie');
    ok(r && r.sections.map(s => s.h).join('|') === 'Erkennung|Ablauf' && (r.me[0] || '').startsWith('/me nimmt '), 'Aufbau');
  });
  T('Stand 6: eine ältere Reihenfolge wird einmal auf die Datei gesetzt, eigene Gruppen bleiben', () => {
    reset0();
    S.v = 5; S.order = S.order.slice().reverse();   // eine selbst sortierte, ältere Reihenfolge
    const eigene = subAdd('b', 'Eigene Gruppe').id, erste = SEED.find(r => r.cat === 'b').id;
    S.subOf[erste] = eigene;   // von dir verschoben
    migrate();
    ok(S.v === 7, 'Stand nicht gesetzt');
    ok(S.order.slice(0, SEED.length).join('|') === SEED.map(r => r.id).join('|'), 'Reihenfolge nicht aus der Datei');
    ok(S.subs.some(s => s.id === eigene), 'eigene Gruppe verloren');
    ok(!own(S.subOf, erste), 'deine Verschiebung wurde nicht zurückgesetzt');
    reset0();
  });
  T('Export mit „ohne Unterkategorie“ bleibt beim Import erhalten', () => {
    reset0(); load();
    const r = SEED.find(x => own(DATA_SUBOF, x.id));
    setRecSub(r.id, '');
    const res = sanitize(JSON.parse(exportText()));
    ok(res.data.subOf[r.id] === '', '„ohne“ ging beim Export verloren');
    reset0();
  });
  T('Ältere Datei beim Import: Reihenfolge und Gruppen kommen aus der Datei', () => {
    reset0();
    const res = importedState({v: 5, ov: {}, del: {}, made: [], order: ['Verstauchung'], subs: [{id: 'eig', cat: 'b', t: 'Eigene'}], subOf: {}, fav: []});
    ok(res.data.order.slice(0, SEED.length).join('|') === SEED.map(r => r.id).join('|'), 'Reihenfolge nicht aus der Datei');
    ok(res.data.subs.some(s => s.id === 'eig') && DATA_GROUPS.every(g => res.data.subs.some(s => s.id === g.id)), 'Gruppen fehlen');
    reset0();
  });
  T('Der Dialog nennt die Gruppen aus der Datei', () => {
    reset0(); load();
    formState = {cat: 'm', title: '', desc: '', text: [], sub: '', newSub: ''};
    const h = formHTML();
    formState = null;
    ok(DATA_GROUPS.filter(g => g.cat === 'm').every(g => h.includes(esc(g.t))), 'Gruppe fehlt im Dialog');
    reset0();
  });
  T('Leere Gruppen aus der Datei zeigen sich nur im Bearbeitungsmodus', () => {
    reset0(); load();
    const leer = DATA_GROUPS.find(g => !SEED.some(r => DATA_SUBOF[r.id] === g.id));
    if (!leer) return;   // die Datei hat gerade keine leere Gruppe
    opened.add(leer.cat); act('view', {dataset: {v: leer.cat}});
    setMode(true); const mit = $('#n').innerHTML.includes(esc(leer.t));
    setMode(false); const ohne = $('#n').innerHTML.includes(esc(leer.t));
    setMode(true); act('view', {dataset: {v: 'a'}});
    reset0();
    ok(mit && !ohne, 'leere Gruppe: im Bearbeiten ' + mit + ', im Zuschauermodus ' + ohne);
  });
  // Aufräumen: Probespeicher und Anzeige auf Ausgangszustand bringen
  reset0();
  SET = {theme: 'dark', cols: 2, sec: 'open', me: 'open', compact: true, nav: 'open'}; saveSet(); applySet(); closeModal(); setMode(false);
  $('#f').innerHTML = '';
  $('#l').innerHTML = `<h2>Tests</h2><p>${res.filter(r => r[0]).length} von ${res.length} bestanden</p>` + res.map(([good, m]) => `<p class="${good ? 'okt' : 'err'}">${good ? '✓' : '✗'} ${esc(m)}</p>`).join('');
}

/* ===== Start ===== */
boot();
</script></body></html>
