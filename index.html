<script>
/* ===== Grundlagen ===== */
const $ = s => document.querySelector(s);
const TEST = /[?&]test\b/.test(location.search);
const C = {v: 'Vitalwerte & Amnestika', b: 'Behandlungen', n: 'Narkose', o: 'Operationen', m: 'Medikamente'};
const RO = {v: 1};                                  // schreibgeschützte Kategorien
const FORM = {m: ['Dosis', 'Wirkung']};             // Formularabschnitte je Kategorie
const DEFAULT_FORM = ['Erkennung', 'Behandlung', 'Ablauf'];
const BG = {'AB+': '0- 0+ B- B+ A- A+ AB- AB+', 'AB-': '0- B- A- AB-', 'A+': '0- 0+ A- A+', 'A-': '0- A-', 'B+': '0- 0+ B- B+', 'B-': '0- B-', '0+': '0- 0+', '0-': '0-'};
const KEY = 'medic-handbuch-v2';
const SETKEY = 'medic-handbuch-einstellungen-v2';   // v2: die neuen Standardwerte gelten einmal für alle
const MAT_DEFAULT = '/me nimmt die benötigten Gegenstände aus dem Verbandskasten';   // Material-Zeile neuer Akten
const BRAND = '<h1 class="brand"><svg class="cross" viewBox="0 0 24 24" aria-hidden="true"><path style="fill:var(--r)" d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg><span>Medic Handbuch</span></h1>';   // Titel mit rotem Kreuz
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const nf = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const clone = x => JSON.parse(JSON.stringify(x));
const lines = t => String(t || '').split('\n').map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
const memStore = () => { const m = {}; return {getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; }}; };
const PERSIST = (() => { try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); return true; } catch (e) { return false; } })();
let store = (TEST || !PERSIST) ? memStore() : localStorage;
let SEED = [], BASE = {};   // werden beim Start aus akten.json geladen
let S, view = 'a', query = '', opened = new Set(), folded = new Set(), secOv = new Map(), editing = null, pending = null, formState = null, sectionForm = null;
let undoStack = [], redoStack = [], lastSaved = null, mergeNext = false;
let EDIT = false;   // Bearbeitungsmodus: im Standard aus, also Zuschauermodus
let SET = {theme: 'dark', cols: 2, sec: 'open', compact: true, nav: 'open'};

/* ===== Einstellungen (nur Darstellung, getrennt von den Akten) ===== */
function loadSet(){
  let x = {};
  try { x = JSON.parse(store.getItem(SETKEY)) || {}; } catch (e) {}
  // Standardwerte, solange noch nichts gespeichert ist: Dunkel, 2 Spalten, Abschnitte ausgeklappt, Kompakte Karten an, Seitenleiste offen
  // Eine frühere Einstellung „Eine Spalte“ bleibt eine Spalte, „Automatisch“ wird zu den Standard-2 Spalten.
  const cols = [1, 2, 3, 4].includes(+x.cols) ? +x.cols : (x.grid === 'one' ? 1 : 2);
  SET = {theme: x.theme === 'light' ? 'light' : 'dark', cols, sec: x.sec === 'closed' ? 'closed' : 'open', compact: x.compact !== false, nav: x.nav === 'closed' ? 'closed' : 'open'};
}
function saveSet(){ try { store.setItem(SETKEY, JSON.stringify(SET)); } catch (e) {} }
function applySet(){
  document.documentElement.dataset.theme = SET.theme;
  document.body.style.setProperty('--cols', String(SET.cols));   // Spalten pro Reihe
  document.body.classList.toggle('compact', SET.compact);
  document.body.classList.toggle('nav-off', SET.nav === 'closed');   // Seitenleiste eingeklappt
  const nb = $('#navbtn');
  if (nb) nb.setAttribute('aria-expanded', String(SET.nav === 'open'));
}

/* ===== Speicher: eine Datei, eine Form, mit Rückgängig-Verlauf ===== */
const fresh = () => ({ov: {}, del: {}, fav: [], order: [], made: []});
function save(){
  const now = JSON.stringify(S);
  if (lastSaved !== null && now !== lastSaved) {
    if (mergeNext) { if (undoStack.length && undoStack[undoStack.length - 1] === now) undoStack.pop(); }   // Eintippen nach „Zeile hinzufügen“ zählt zum selben Schritt
    else { undoStack.push(lastSaved); if (undoStack.length > 60) undoStack.shift(); }
    redoStack = [];
  }
  mergeNext = false;
  lastSaved = now;
  try { store.setItem(KEY, now); } catch (e) { toast('Speichern nicht möglich'); }
}
function applyState(json){
  S = JSON.parse(json);
  S.order = orderFix(S.order);
  lastSaved = JSON.stringify(S);
  try { store.setItem(KEY, lastSaved); } catch (e) {}
}
function orderFix(saved, made = S.made){
  const ids = SEED.map(r => r.id).concat(made.map(r => r.id)), seen = new Set(), out = [];
  (saved || []).concat(ids).forEach(id => { if (ids.includes(id) && !seen.has(id)) { seen.add(id); out.push(id); } });
  return out;
}
function load(){
  S = fresh();
  let raw = null;
  try { raw = store.getItem(KEY); } catch (e) {}
  if (raw) { try { Object.assign(S, JSON.parse(raw)); } catch (e) { S = fresh(); } }
  else { // bisherige Version: Kennung = Titel, daher keine Umwandlung nötig
    try { S.fav = JSON.parse(store.getItem('f')) || []; } catch (e) {}
    try { const me = JSON.parse(store.getItem('me')) || {}; Object.keys(me).forEach(t => { if (BASE[t]) S.ov[t] = {me: me[t]}; }); } catch (e) {}
  }
  S.order = orderFix(S.order);
  lastSaved = JSON.stringify(S);
  undoStack = []; redoStack = []; mergeNext = false;
}

/* ===== Akten lesen und ändern (immer kopierend, nie die Grunddaten verändern) ===== */
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const withKeys = secs => (secs || []).map((s, i) => (s.k ? s : Object.assign({}, s, {k: 'b' + i})));
const validBox = b => Array.isArray(b) ? b.every(t => typeof t === 'string')   // alte Form: nur die Zeilen
  : (!!b && typeof b === 'object' && (b.t === undefined || typeof b.t === 'string') && Array.isArray(b.me) && b.me.every(t => typeof t === 'string'));
const normBox = b => Array.isArray(b) ? {t: '', me: b.filter(t => typeof t === 'string')}
  : {t: (b && typeof b.t === 'string') ? b.t.trim() : '', me: (b && Array.isArray(b.me) ? b.me : []).filter(t => typeof t === 'string')};
const boxesOf = r => (r && Array.isArray(r.boxes) ? r.boxes.map(normBox) : []);   // zusätzliche /me-Boxen einer Akte, immer frische Kopien
const boxAt = s => (/^x\d+$/.test(s) ? +s.slice(1) : -1);   // 'x0', 'x1' … = zusätzliche Box Nr. 0, 1 …
const get = id => {
  const m = S.made.find(r => r.id === id);
  if (m) return Object.assign({}, m, {sections: withKeys(m.sections)});
  if (!BASE[id]) return null;
  const o = S.ov[id] || {};
  return Object.assign({}, BASE[id], o, {sections: withKeys(o.sections || BASE[id].sections)});
};
const all = () => S.order.map(get).filter(Boolean);
const live = () => all().filter(r => !S.del[r.id]);
const trashed = () => all().filter(r => S.del[r.id]);
function patch(id, field, value){

/* ===== Bearbeiten: ein Mechanismus für alle Textstellen ===== */
function startEdit(el){
  if (editing) {   // eine andere Stelle ist noch offen: erst abschließen, dann die angeklickte Stelle in der neu gezeichneten Anzeige suchen
    const rec = el.dataset.rec, path = el.dataset.path;
    finishEdit();
    el = [...document.querySelectorAll('.tx')].find(x => x.dataset.rec === rec && x.dataset.path === path);
    if (!el) return;
  }
  editing = {el, cancel: false};
  el.contentEditable = 'true'; el.classList.add('ed');
  el.textContent = el.dataset.raw; el.focus();
  const rg = document.createRange(); rg.selectNodeContents(el);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg);
}
function finishEdit(){
  if (!editing) return;
  const {el, cancel} = editing; editing = null;
  el.contentEditable = 'false'; el.classList.remove('ed');
  if (!cancel) { const t = el.textContent.replace(/\s+/g, ' ').trim(); if (t !== el.dataset.raw) setText(el.dataset.rec, el.dataset.path, t); }
  render();
}

/* ===== Aktionen: ein Handler für alle Schaltflächen (data-act) ===== */
function openRec(id){
  const r = get(id);
  if (!r) return;
  const next = S.del[id] ? 'trash' : r.cat;
  if (next !== view) { folded.clear(); secOv.clear(); }
  folded.delete(id); clearSecs(id);
  view = next; query = ''; $('#q').value = ''; opened.add(r.cat); sectionForm = null;
  pending = {id}; render();
}
function setQuery(v){ query = v; folded.clear(); render(); }
function toggleFold(id){ if (folded.has(id)) { folded.delete(id); clearSecs(id); } else folded.add(id); }
function toggleSec(id, k){ secOv.set(id + '|' + k, !secOpen(id, k)); }
function openSecAt(id, si){ const r = get(id), s = r && r.sections[si]; if (s) secOv.set(id + '|' + s.k, true); }
function clearSecs(id){ [...secOv.keys()].forEach(k => { if (k.startsWith(id + '|')) secOv.delete(k); }); }
function focusField(sel){ const t = document.querySelector(sel); if (t) t.focus(); }
function newKey(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function moveSection(id, si, d){
  const secs = clone(get(id).sections), j = si + d;
  if (j < 0 || j >= secs.length) return;
  [secs[si], secs[j]] = [secs[j], secs[si]];
  patch(id, 'sections', secs);
}
function setSecMode(id, si, mode){
  if (!own(MODES, mode)) return;
  const secs = clone(get(id).sections);
  if (!secs[si]) return;
  secs[si].mode = mode;
  patch(id, 'sections', secs);
}
function submit(){
  const v = readForm(), secs = FORM[v.cat] || DEFAULT_FORM;
  const r = create({cat: v.cat, title: v.title, desc: v.desc, sections: secs.map((h, i) => ({h, text: v.text[i] || ''}))});
  if (r.errors) { formState = Object.assign(v, {errors: r.errors}); return render(); }
  formState = null; view = v.cat; query = ''; opened.add(v.cat); $('#q').value = ''; folded.clear(); secOv.clear(); sectionForm = null;
  pending = {id: r.id}; render(); toast('Akte angelegt');
}

/* ===== Einstellungen ===== */

/* ===== Rückgängig und Wiederholen ===== */
function undo(){
  if (editing) finishEdit();
  if (!undoStack.length) return render();
  redoStack.push(lastSaved);
  applyState(undoStack.pop());
  render(); toast('Rückgängig gemacht');
}
function redo(){
  if (editing) finishEdit();
  if (!redoStack.length) return render();
  undoStack.push(lastSaved);
  applyState(redoStack.pop());
  render(); toast('Wiederholt');
}

const EDIT_ONLY = new Set(['edit', 'trash', 'restore', 'purge', 'reset', 'recmove', 'move', 'secmove', 'remove', 'add', 'delsec', 'addbox', 'rmbox', 'newform', 'secform', 'secsave', 'create', 'import', 'importakte', 'undo', 'redo']);   // nur im Bearbeitungsmodus
function act(name, b){
  if (EDIT_ONLY.has(name) && !EDIT) return;   // Zuschauermodus: nichts ändern, nichts hinzufügen
  const d = b.dataset, id = d.id;
  if (name === 'edit') return startEdit(b.closest('[data-hold]').querySelector('.tx'));
  if (name === 'go') return openRec(id);
  if (name === 'toggle') { if (opened.has(d.v)) opened.delete(d.v); else opened.add(d.v); return renderNav(); }
  if (name === 'create') return submit();
  if (name === 'export') return exportData();
  if (name === 'import') return $('#imp').click();
  if (name === 'mode') return setMode(!EDIT);
  if (name === 'navtoggle') { SET.nav = SET.nav === 'open' ? 'closed' : 'open'; saveSet(); return applySet(); }
  if (name === 'exportrec') return exportAkte(id);
  if (name === 'importakte') return $('#impakte').click();
  if (name === 'fold') { toggleFold(id); return render(); }
  if (name === 'secopen') { toggleSec(id, d.sk); return render(); }
  if (name === 'undo') return undo();
  if (name === 'redo') return redo();
  if (name === 'settings') return openModal();
  if (name === 'closemodal') return closeModal();
  if (name === 'set') return setOpt(d.k, d.v);
  if (name === 'view') { view = d.v; query = ''; $('#q').value = ''; folded.clear(); secOv.clear(); sectionForm = null; if (C[d.v]) opened.add(d.v); }
  else if (name === 'fav') fav(id);
  else if (name === 'move') move(id, d.s, +d.i, +d.d);
  else if (name === 'secmove') moveSection(id, +d.s, +d.d);
  else if (name === 'remove') removeLine(id, d.s, +d.i);
  else if (name === 'add') { if (/^\d+$/.test(d.s)) openSecAt(id, +d.s); pending = {id, path: addLine(id, d.s, d.start)}; }
  else if (name === 'addbox') pending = {id, path: addBox(id)};
  else if (name === 'rmbox') removeBox(id, +d.b);
  else if (name === 'delsec') delSection(id, +d.s);
  else if (name === 'recmove') moveRec(id, +d.d);
  else if (name === 'trash') trash(id);
  else if (name === 'restore') restore(id);
  else if (name === 'purge') { if (confirm('Akte endgültig löschen? Das lässt sich nicht rückgängig machen.')) purge(id); }
  else if (name === 'reset') { if (confirm('Eigene Änderungen an dieser Akte verwerfen?')) reset(id); }
  else if (name === 'newform') formState = formState ? null : {cat: (C[view] && !RO[view]) ? view : 'b', title: '', desc: '', text: []};
  else if (name === 'closeform') formState = null;
  else if (name === 'secform') sectionForm = (sectionForm && sectionForm.id === id) ? null : {id, name: '', text: '', mode: 'bullet', errors: null};
  else if (name === 'secsave') {
    if (sectionForm) {
      const res = addSection(id, sectionForm.name, sectionForm.text, sectionForm.mode);
      if (res.errors) sectionForm.errors = res.errors;
      else { secOv.set(id + '|' + res.k, true); sectionForm = null; toast('Abschnitt hinzugefügt'); }
    }
  }
  else if (name === 'seccancel') sectionForm = null;
  render();
  if (name === 'newform' && formState) focusField('#ftitle');
  if (name === 'secform' && sectionForm) focusField('[data-sf="name"]');
}

/* ===== Abschnitt hinzufügen: frei gewählter Name, Darstellung, mindestens eine Zeile ===== */
function addSection(id, name, text, mode){
  const r = get(id), n = cleanText(name), items = lines(text), e = {};
  if (!r || RO[r.cat]) return {errors: {name: 'Bei dieser Akte lassen sich keine Abschnitte hinzufügen.'}};
  if (!n) e.name = 'Bitte einen Namen eingeben.';
  else if (n.length > 60) e.name = 'Der Name darf höchstens 60 Zeichen lang sein.';
  else if (r.sections.some(s => nf(s.h) === nf(n))) e.name = 'Einen Abschnitt mit diesem Namen gibt es schon.';
  if (!items.length) e.text = 'Mindestens eine Zeile eingeben.';
  if (Object.keys(e).length) return {errors: e};
  const secs = clone(r.sections), k = newKey();
  secs.push({h: n, items, mode: own(MODES, mode) ? mode : 'bullet', k});
  patch(id, 'sections', secs);
  return {ok: true, k};
}

/* ===== Import: jede Angabe wird geprüft, ungültige Teile werden übersprungen ===== */
const cleanText = t => (typeof t === 'string' ? t.replace(/\s+/g, ' ').trim() : '');
function looksLikeExport(d){
  return !!d && typeof d === 'object' && !Array.isArray(d) && ['ov', 'del', 'fav', 'made', 'order'].some(k => k in d);
}
function cleanSections(x){
  const out = [];
  (Array.isArray(x) ? x : []).forEach(s => {
    if (!s || typeof s !== 'object') return;
    const h = cleanText(s.h), items = (Array.isArray(s.items) ? s.items : []).filter(t => typeof t === 'string' && t.trim()).map(t => t.trim());
    if (!h || !items.length) return;
    const o = {h, items};
    if (typeof s.k === 'string' && s.k) o.k = s.k;
    if (own(MODES, s.mode)) o.mode = s.mode;
    out.push(o);
  });
  return out;
}
function cleanBoxes(x){ return (Array.isArray(x) ? x : []).filter(validBox).map(normBox); }
function cleanMade(x, seen){
  if (!x || typeof x !== 'object' || !Array.isArray(x.sections)) return null;
  const id = typeof x.id === 'string' ? x.id.trim() : '', title = cleanText(x.title);
  if (!id || own(BASE, id) || seen.has(id) || !own(C, x.cat) || RO[x.cat] || !title) return null;
  return {id, cat: x.cat, title, desc: typeof x.desc === 'string' ? x.desc : '', kw: '', sections: cleanSections(x.sections),
    me: Array.isArray(x.me) ? x.me.filter(t => typeof t === 'string') : [], boxes: cleanBoxes(x.boxes), table: null, widget: false};
}
function cleanOv(x){
  const o = {};
  if (!x || typeof x !== 'object') return o;
  const t = cleanText(x.title); if (t) o.title = t;
  if (typeof x.desc === 'string') o.desc = x.desc;
  if (Array.isArray(x.me)) o.me = x.me.filter(v => typeof v === 'string');
  if (Array.isArray(x.boxes)) o.boxes = cleanBoxes(x.boxes);
  if (Array.isArray(x.sections)) o.sections = cleanSections(x.sections);
  return o;
}
function sanitize(d){
  const out = fresh(), seen = new Set();
  let skipped = 0;
  if (Array.isArray(d.made)) d.made.forEach(x => {
    const m = cleanMade(x, seen);
    if (m) { seen.add(m.id); out.made.push(m); } else skipped++;
  });
  const known = id => own(BASE, id) || seen.has(id);
  if (d.ov && typeof d.ov === 'object') Object.keys(d.ov).forEach(k => {
    if (!own(BASE, k)) { skipped++; return; }
    const o = cleanOv(d.ov[k]);
    if (Object.keys(o).length) out.ov[k] = o;
  });
  if (d.del && typeof d.del === 'object') Object.keys(d.del).forEach(k => { if (known(k)) out.del[k] = 1; else skipped++; });
  if (Array.isArray(d.fav)) out.fav = [...new Set(d.fav.filter(x => typeof x === 'string' && known(x)))];
  out.order = orderFix(Array.isArray(d.order) ? d.order.filter(x => typeof x === 'string' && known(x)) : [], out.made);
  return {data: out, skipped};
}
// Enthält die Datei keine Favoriten, bleiben die eigenen erhalten.
function importedState(d){
  const res = sanitize(d);
  if (!Array.isArray(d.fav)) {
    const ids = new Set(SEED.map(r => r.id).concat(res.data.made.map(m => m.id)));
    res.data.fav = S.fav.filter(id => ids.has(id));
  }
  return res;
}
function importFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    let d = null;
    try { d = JSON.parse(rd.result); } catch (e) {}
    if (!looksLikeExport(d)) return toast('Das ist keine Export-Datei dieses Handbuchs');
    if (!confirm('Deine Änderungen werden durch die Datei ersetzt. Favoriten bleiben, wenn die Datei keine enthält. Fortfahren?')) return;
    const res = importedState(d);
    S = res.data; secOv.clear(); save(); render();
    toast(res.skipped ? 'Importiert, ' + res.skipped + ' ungültige Einträge übersprungen' : 'Importiert');
  };
  rd.onerror = () => toast('Die Datei konnte nicht gelesen werden');
  rd.readAsText(file);
}

/* ===== Kopieren und Meldungen ===== */

    .then(() => toast('Kopiert'), () => toast('Kopieren blockiert, bitte markieren und Strg+C'));
}
let toastTimer;
function toast(m){ const o = $('#ok'); o.textContent = m; o.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => o.classList.remove('on'), 1400); }

/* ===== Ereignisse: je eine Stelle pro Art, keine Inline-Handler ===== */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();          // Klick auf den Hintergrund schließt das Fenster
  const b = e.target.closest('[data-act]');
  if (b) { if (b.tagName === 'A') e.preventDefault(); return act(b.dataset.act, b); }
  const sh = e.target.closest('h4[data-sk]');
  if (sh && !e.target.closest('button,select,input,textarea') && !(editing && editing.el.contains(e.target))) { toggleSec(sh.dataset.rec, sh.dataset.sk); return render(); }
  const h = e.target.closest('h2');
  if (h && h.querySelector('.arw') && !(editing && editing.el.contains(e.target))) { toggleFold(h.parentNode.dataset.rec); return render(); }
  const ml = e.target.closest('.ml.cp');   // nur Zeilen mit /me sind kopierbar
  if (ml && !editing) copy(ml.dataset.raw);
});
document.addEventListener('focusout', e => { if (editing && e.target === editing.el) finishEdit(); });
document.addEventListener('keydown', e => {
  const mo = $('#modal');
  if (mo && mo.hidden === false) { if (e.key === 'Escape') closeModal(); return; }
  if (editing && e.target === editing.el) {
    if (e.key === 'Enter') { e.preventDefault(); editing.el.blur(); }
    else if (e.key === 'Escape') { editing.cancel = true; editing.el.blur(); }
    return;
  }
  const typing = e.target.matches && e.target.matches('input,textarea,select,[contenteditable="true"]');
  if ((e.ctrlKey || e.metaKey) && !typing && EDIT) {
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); return undo(); }
    if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); return redo(); }
  }
  if (e.key === 'Escape' && (formState || sectionForm)) { formState = null; sectionForm = null; render(); }
});
document.addEventListener('input', e => {

document.addEventListener('change', e => {

  else if (t.matches && t.matches('select[data-smode]')) { if (EDIT) { setSecMode(t.dataset.id, +t.dataset.s, t.value); render(); } }
  else if (t.dataset && t.dataset.sf && sectionForm) sectionForm[t.dataset.sf] = t.value;
  else if (t.id === 'fcat') { formState = Object.assign(readForm(), {text: [], errors: null}); render(); }
  else if (t.id === 'imp') { const f = t.files[0]; t.value = ''; if (f) importFile(f); }   // Auswahl leeren, damit dieselbe Datei erneut gewählt werden kann
  else if (t.id === 'impakte') { const f = t.files[0]; t.value = ''; if (f) importAkteFile(f); }   // eine einzelne Akte aus einer Datei
  else if (t.id === 'datafile') { const f = t.files[0]; if (f) loadDataFile(f); }          // akten.json von Hand auswählen (Fallback)
});

/* ===== Start: akten.json laden, prüfen, dann anzeigen ===== */
// Pfad zur Datei, relativ zur Seite berechnet: funktioniert auch in einem Unterordner (z. B. GitHub Pages unter /repo/)
const DATA_URL = new URL('./akten.json', document.baseURI).href;
async function boot(){
  loadSet(); applySet();
  $('#l').innerHTML = '<p class="empty">Akten werden geladen …</p>';
  let text;
  try {
    const r = await fetch(DATA_URL, {cache: 'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status + ' – die Datei fehlt oder liegt nicht im selben Ordner wie index.html.');
    text = await r.text();
  } catch (e) { return dataError(location.protocol === 'file:' ? 'Die Datei akten.json fehlt oder kann nicht geladen werden.' : 'akten.json konnte nicht geladen werden: ' + e.message, true); }
  parseAndStart(text);
}
function parseAndStart(text){
  let raw;
  try { raw = JSON.parse(text); }
  catch (e) { return dataError('akten.json ist kein gültiges JSON: ' + e.message, true); }
  startWith(parseData(raw));
}
function startWith(res){
  if (!res.records.length) return dataError('Es wurde keine gültige Akte gefunden.', true, res.problems);
  applyData(res);
  load(); render();
  if (TEST) runTests();
}
function dataError(msg, offerFile, problems = []){
  $('#n').innerHTML = BRAND;
  const local = location.protocol === 'file:' ? '<p>Du öffnest die Seite direkt von der Festplatte. Dabei darf der Browser akten.json nicht laden. Lade die Datei unten hoch, oder öffne die Seite über einen Webserver, zum Beispiel GitHub Pages.</p>' : '';
  const list = problems.length ? `<ul>${problems.slice(0, 12).map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : '';
  const pick = offerFile ? '<p><label>akten.json auswählen <input type="file" id="datafile" accept=".json,application/json"></label></p>' : '';
  $('#l').innerHTML = `<div class="errbox"><h3>Die Akten konnten nicht geladen werden</h3><p>${esc(msg)}</p>${local}${list}${pick}</div>`;
}
function loadDataFile(file){
  const rd = new FileReader();
  rd.onload = () => parseAndStart(String(rd.result));
  rd.onerror = () => dataError('Die Datei konnte nicht gelesen werden.', true);
  rd.readAsText(file);
}

  T('Suchtreffer werden markiert', () => { reset0(); const r = E(); const w = (r.sections[0].items[0].split(' ')[0] || '').replace(/[^\p{L}]/gu, ''); query = w; const c = card(get(r.id)); query = ''; ok(w && c.includes('<mark>'), 'keine Markierung für ' + w); });
  T('Treffer im Text bleiben als HTML sicher', () => { query = 'b'; const out = hlEsc('<i>b</i>'); query = ''; ok(out === '&lt;i&gt;<mark>b</mark>&lt;/i&gt;', out); });
  T('Zusätzliche /me-Box anlegen, befüllen, entfernen', () => { reset0(); const i = id(), path = addBox(i); ok(get(i).boxes.length === 1 && path === 'x:0:0', 'nicht angelegt'); setText(i, path, '/me Test-Box'); ok(get(i).boxes[0].me[0] === '/me Test-Box', 'Zeile nicht gespeichert'); const c = card(get(i)); ok(c.includes('Zusätzliche Box') && c.includes('data-s="x0"'), 'nicht angezeigt'); removeBox(i, 0); ok(get(i).boxes.length === 0, 'nicht entfernt'); });
  T('Zusätzliche Boxen bleiben beim Export und Import erhalten', () => { reset0(); const i = id(); addBox(i); setText(i, 'x:0:0', '/me Export-Box'); const r = sanitize(JSON.parse(exportText())); ok(r.data.ov[i].boxes[0].me[0] === '/me Export-Box', 'Box fehlt nach dem Import'); });
  T('Alte und neue Box-Form werden übernommen', () => { const a = parseData([{id: 'by', cat: 'b', title: 'BY', boxes: [['/me a']]}]).records[0], n = parseData([{id: 'bz', cat: 'b', title: 'BZ', boxes: [{t: 'Nachsorge', me: ['/me b']}]}]).records[0]; ok(a.boxes[0].me[0] === '/me a' && a.boxes[0].t === '', 'alte Form'); ok(n.boxes[0].t === 'Nachsorge' && n.boxes[0].me[0] === '/me b', 'neue Form'); });
  T('Boxen mit falschem Format werden erkannt', () => ok(parseData([{id: 'bx', cat: 'b', title: 'BX', boxes: 'kaputt'}]).problems.length === 1, 'kaputte Box nicht erkannt'));
  T('Titel in der Seitenleiste ohne Bindestrich, mit rotem Kreuz', () => { const h = $('#n').innerHTML; ok(h.includes('Medic Handbuch') && !h.includes('Medic-Handbuch'), 'Titel falsch'); ok(h.includes('<svg'), 'Kreuz fehlt'); });
  T('Browser-Titel ohne Textsymbol, Symbol im Reiter', () => { ok(document.title === 'SCP-RP Medic Handbuch', document.title); ok(!document.title.includes('✚'), 'Textsymbol im Titel'); ok(!!document.querySelector('link[rel="icon"]'), 'Symbol im Reiter fehlt'); });
  T('Angepasste Akten bekommen einen dezenten Punkt, Originale nicht', () => { reset0(); const i = id(); ok(!card(get(i)).includes('class="dot"'), 'Punkt ohne Änderung'); setText(i, 'i:0:0', 'Punkt-Test'); ok(card(get(i)).includes('class="dot"'), 'kein Punkt nach Änderung'); reset(i); ok(!card(get(i)).includes('class="dot"'), 'Punkt nach dem Zurücksetzen'); });
  T('Einzelne Akte exportieren und als eigene Akte wieder importieren', () => { reset0(); const i = id(), src = get(i), obj = akteExportObj(i); ok(obj.format === 'medic-akte' && obj.akte.title === src.title, 'Export falsch'); ok(!JSON.stringify(obj).includes('"k"'), 'interne Schlüssel im Export'); const before = S.made.length; const res = akteImport(JSON.parse(JSON.stringify(obj))); ok(res.id && S.made.length === before + 1, 'nicht angelegt'); const m = get(res.id); ok(m.title !== src.title && m.title.includes('(importiert)'), 'Titel nicht umbenannt: ' + m.title); ok(JSON.stringify(m.sections.map(s => s.items)) === JSON.stringify(src.sections.map(s => s.items)), 'Zeilen weichen ab'); ok(m.me.join('|') === src.me.join('|'), 'Handlungen weichen ab'); });
  T('Ungültige Akten-Dateien werden abgelehnt', () => { ok(akteImport({format: 'medic-handbuch'}).errors, 'falsches Format angenommen'); ok(akteImport({format: 'medic-akte', akte: {cat: 'v', title: 'X', sections: [{h: 'A', items: ['x']}]}}).errors.cat, 'schreibgeschützte Kategorie angenommen'); ok(akteImport({format: 'medic-akte', akte: {cat: 'b', title: 'Leer', sections: []}}).errors.sections, 'Akte ohne Abschnitte angenommen'); });
  T('Zuschauermodus ist der Standard', () => ok(startedInView, 'beim Start war der Bearbeitungsmodus an'));
  T('Im Zuschauermodus gibt es keine Bearbeiten-Schaltflächen', () => {
    setMode(false); reset0(); const c = card(get(id())); setMode(true);
    ok(!/data-act="(edit|add|move|remove|trash|recmove|secmove|delsec|addbox|rmbox|secform|reset)"/.test(c), 'Bearbeiten-Schaltfläche sichtbar');
    ok(!c.includes('class="smode"') && !c.includes('+ Abschnitt hinzufügen'), 'Darstellung oder Abschnitt hinzufügen sichtbar');
    ok(c.includes('data-act="exportrec"') && c.includes('data-act="fav"') && c.includes('data-act="fold"'), 'Export, Kopieren, Favorit oder Einklappen fehlt');
  });
  T('Im Zuschauermodus lassen sich Inhalte nicht ändern', () => {
    setMode(false); reset0(); const i = id(), before = JSON.stringify(S);
    act('newform', {dataset: {}}); act('trash', {dataset: {id: i}}); act('add', {dataset: {id: i, s: 'm'}}); act('undo', {dataset: {}});
    const formOffen = formState !== null, geaendert = JSON.stringify(S) !== before;
    setMode(true);
    ok(!formOffen, 'Formular geöffnet'); ok(!geaendert, 'Daten geändert');
  });
  T('Umschalter in der Kopfleiste schaltet den Bearbeitungsmodus um', () => {
    setMode(false); act('mode', {dataset: {}}); const an = EDIT && document.body.classList.contains('edit') && $('#modebtn').getAttribute('aria-pressed') === 'true';
    act('mode', {dataset: {}}); const aus = !EDIT && !document.body.classList.contains('edit') && $('#modebtn').getAttribute('aria-pressed') === 'false';
    setMode(true); ok(an && aus, 'Umschalter wirkt nicht');
  });
  T('Die Hauptbox heißt Durchführung, neue Boxen bekommen einen Titel', () => { reset0(); const i = id(); ok(card(get(i)).includes('Durchführung'), 'Titel der Hauptbox fehlt'); addBox(i); ok(get(i).boxes[0].t === 'Zusätzliche Box' && card(get(i)).includes('Zusätzliche Box'), 'Titel der neuen Box fehlt'); });
  T('Titel einer zusätzlichen Box lässt sich ändern', () => { reset0(); const i = id(); addBox(i); setText(i, 'xt:0', 'Nachsorge'); ok(get(i).boxes[0].t === 'Nachsorge' && card(get(i)).includes('Nachsorge'), 'Titel nicht geändert'); });
  T('Kein Alle-kopieren-Knopf in den /me-Boxen', () => { reset0(); const c = card(get(id())); ok(!c.includes('Alle kopieren') && !c.includes('data-act="copyall"'), 'Knopf noch da'); });
  T('Einstellungen: der Standard steht immer links', () => { renderSettings(); const erster = k => document.querySelector(`#mbody [data-k="${k}"]`).dataset.v; ok(erster('theme') === 'dark' && erster('cols') === '2' && erster('sec') === 'open' && erster('compact') === 'on', 'Standard nicht links'); });
  T('Spalten pro Reihe: 1 bis 4, ungültige Werte fallen auf 2 zurück', () => { setOpt('cols', '4'); ok(SET.cols === 4 && document.body.style.getPropertyValue('--cols').trim() === '4', 'vier Spalten nicht gesetzt'); setOpt('cols', '9'); ok(SET.cols === 2, 'ungültiger Wert nicht abgefangen'); setOpt('cols', '2'); });
  T('Volle Breite: die Kartenreihe hat keine Breitenbegrenzung mehr', () => ok(getComputedStyle(document.getElementById('l')).maxWidth === 'none', 'Breitenbegrenzung noch da'));
  T('Seitenleiste ein- und ausklappen', () => { SET.nav = 'open'; applySet(); act('navtoggle', {dataset: {}}); const zu = SET.nav === 'closed' && document.body.classList.contains('nav-off') && getComputedStyle(document.querySelector('nav')).display === 'none'; act('navtoggle', {dataset: {}}); ok(zu && SET.nav === 'open' && !document.body.classList.contains('nav-off'), 'Seitenleiste reagiert nicht'); });
  T('Spalten und Seitenleiste werden gespeichert', () => { setOpt('cols', '3'); act('navtoggle', {dataset: {}}); SET = {theme: 'dark', cols: 2, sec: 'open', compact: true, nav: 'open'}; loadSet(); const gemerkt = SET.cols === 3 && SET.nav === 'closed'; setOpt('cols', '2'); act('navtoggle', {dataset: {}}); ok(gemerkt, 'nicht gespeichert'); });
  T('Gespeicherte Einstellung „Eine Spalte“ wird zu einer Spalte', () => { store.setItem(SETKEY, JSON.stringify({grid: 'one'})); loadSet(); const eine = SET.cols === 1; store.removeItem(SETKEY); ok(eine, 'alte Einstellung nicht übernommen'); });
  // Aufräumen: Probespeicher und Anzeige auf Ausgangszustand bringen
  reset0();
  SET = {theme: 'dark', cols: 2, sec: 'open', compact: true, nav: 'open'}; saveSet(); applySet(); closeModal(); setMode(false);
  $('#f').innerHTML = '';
  $('#l').innerHTML = `<h2>Tests</h2><p>${res.filter(r => r[0]).length} von ${res.length} bestanden</p>` + res.map(([good, m]) => `<p class="${good ? 'okt' : 'err'}">${good ? '✓' : '✗'} ${esc(m)}</p>`).join('');
}

/* ===== Start ===== */
boot();
</script></body></html>
